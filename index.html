<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ECHO</title>
<style>
  html,body{margin:0;background:#0d0d14;overflow:hidden;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;color:#eee}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  canvas{background:#15151f;border:3px solid #333;border-radius:6px;box-shadow:0 0 40px rgba(6,214,160,0.15)}
  #hud{display:flex;justify-content:space-between;width:480px;font-size:14px;letter-spacing:1px}
  #hud span{color:#ffd166}
  #hint{font-size:12px;color:#666}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>LIVES <span id="lives">3</span></div>
    <div>LEVEL <span id="level">1</span>/3</div>
    <div>BEST <span id="best">0</span></div>
  </div>
  <canvas id="c" width="480" height="320"></canvas>
  <div id="hint">SPACE jump &nbsp;|&nbsp; P pause &nbsp;|&nbsp; land near your ghost in mid-air for SYNC multiplier</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const bestEl = document.getElementById('best');

const GROUND_Y = 260;
const GRAVITY = 0.6;
const JUMP_V = -11;
const LEVEL_LENGTH = 3200;

// ---- persistent high score (free, local only) ----
const BEST_KEY = 'echo_best_score';
let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
bestEl.textContent = best;

// ---- synthesized sound (no files) ----
let audioCtx = null;
function sfx(freq, dur, type='square', vol=0.08){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq; gain.gain.value = vol;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
const sfxJump = ()=>sfx(440,0.12,'square');
const sfxCoin = ()=>{ sfx(880,0.08,'triangle'); setTimeout(()=>sfx(1320,0.08,'triangle'),40); };
const sfxSync = ()=>{ sfx(660,0.1,'sawtooth'); setTimeout(()=>sfx(990,0.15,'sawtooth'),60); };
const sfxHit  = ()=>sfx(160,0.25,'sawtooth',0.1);
const sfxWin  = ()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,0.2,'triangle',0.09), i*110)); };

// ---- game state machine ----
// states: 'title' | 'playing' | 'paused' | 'dead' | 'levelclear' | 'victory' | 'gameover'
let state = 'title';
let level = 1;
let lives = 3;
let score = 0;
let multiplier = 1;
let syncCooldown = 0;
let popups = [];
let frame = 0;
let distance = 0;
let worldSpeed = 4;

let player, obstacles, coins;
let inputLog = [], ghostLog = [], ghostPlayer = null, ghostIdx = 0;

const LEVEL_THEMES = [
  { name: 'MEADOW', bg: '#15151f', ground: '#2a2a3a', ob: '#ef476f', speed: 4, gap: 240 },
  { name: 'CANYON', bg: '#1a1420', ground: '#3a2a3a', ob: '#f78c6b', speed: 5, gap: 210 },
  { name: 'VOID',   bg: '#0a0a16', ground: '#242450', ob: '#c77dff', speed: 6, gap: 190 },
];

function makeObstacles(theme){
  let obs = [];
  let x = 500;
  while(x < LEVEL_LENGTH){
    x += theme.gap + Math.random()*80;
    obs.push({ x, w: 20, h: 20 + Math.random()*26 });
  }
  return obs;
}
function makeCoins(theme){
  let coins = [];
  let x = 420;
  while(x < LEVEL_LENGTH){
    x += 170 + Math.random()*60;
    coins.push({ x, y: GROUND_Y - 50 - Math.random()*40, r: 6, collected: false });
  }
  return coins;
}

function newPlayer(){ return { x: 60, y: GROUND_Y, vy: 0, w: 24, h: 24, onGround: true }; }

function startLevel(keepGhost){
  const theme = LEVEL_THEMES[level-1];
  worldSpeed = theme.speed;
  distance = 0; frame = 0;
  player = newPlayer();
  obstacles = makeObstacles(theme);
  coins = makeCoins(theme);
  multiplier = 1; syncCooldown = 0; popups = [];
  if(keepGhost && inputLog.length){ ghostLog = inputLog.slice(); }
  inputLog = [];
  if(ghostLog.length){ ghostPlayer = newPlayer(); ghostIdx = 0; } else { ghostPlayer = null; }
  state = 'playing';
}

function startGame(){
  level = 1; lives = 3; score = 0;
  ghostLog = []; ghostPlayer = null;
  livesEl.textContent = lives;
  levelEl.textContent = level;
  scoreEl.textContent = score;
  startLevel(false);
}

function jump(p){ if(p.onGround){ p.vy = JUMP_V; p.onGround = false; } }
function physics(p){ p.vy += GRAVITY; p.y += p.vy; if(p.y >= GROUND_Y){ p.y = GROUND_Y; p.vy = 0; p.onGround = true; } }
function rectsOverlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

window.addEventListener('keydown', (e)=>{
  if(e.code === 'KeyP' && (state === 'playing' || state === 'paused')){
    state = state === 'playing' ? 'paused' : 'playing';
    return;
  }
  if(e.code !== 'Space') return;
  e.preventDefault();

  if(state === 'title'){ startGame(); return; }
  if(state === 'dead'){ // lost a life, same level, ghost carries over
    startLevel(true); return;
  }
  if(state === 'levelclear'){
    level++;
    levelEl.textContent = level;
    startLevel(true);
    return;
  }
  if(state === 'victory' || state === 'gameover'){ startGame(); return; }
  if(state === 'playing'){
    inputLog.push(frame);
    jump(player);
    sfxJump();
  }
});

function endRunLoseLife(){
  lives--;
  livesEl.textContent = lives;
  sfxHit();
  if(lives <= 0){
    if(score > best){ best = score; localStorage.setItem(BEST_KEY, best); bestEl.textContent = best; }
    state = 'gameover';
  } else {
    state = 'dead';
  }
}

function update(){
  frame++;
  distance += worldSpeed;
  score += 1 * multiplier;
  scoreEl.textContent = Math.floor(score/5);

  physics(player);

  if(ghostPlayer){
    if(ghostIdx < ghostLog.length && ghostLog[ghostIdx] === frame){ jump(ghostPlayer); ghostIdx++; }
    physics(ghostPlayer);
    if(syncCooldown > 0) syncCooldown--;
    const bothAir = !player.onGround && !ghostPlayer.onGround;
    const close = Math.abs(player.y - ghostPlayer.y) < 18;
    if(bothAir && close && syncCooldown === 0){
      multiplier = Math.min(multiplier + 1, 5);
      syncCooldown = 60;
      popups.push({ x: player.x, y: player.y - 50, text: 'SYNC x'+multiplier, life: 40 });
      sfxSync();
    }
  } else {
    multiplier = 1;
  }

  for(const o of obstacles) o.x -= worldSpeed;
  for(const c of coins) c.x -= worldSpeed;

  const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
  for(const o of obstacles){
    const oBox = { x: o.x, y: GROUND_Y - o.h, w: o.w, h: o.h };
    if(rectsOverlap(pBox, oBox)){ endRunLoseLife(); return; }
  }
  for(const c of coins){
    if(c.collected) continue;
    const dx = (player.x+player.w/2)-c.x, dy=(player.y-player.h/2)-c.y;
    if(Math.sqrt(dx*dx+dy*dy) < 16){
      c.collected = true;
      score += 20*multiplier;
      popups.push({ x:c.x, y:c.y, text:'+'+(20*multiplier), life:30 });
      sfxCoin();
    }
  }
  popups = popups.filter(p => (p.life-- > 0));

  if(distance >= LEVEL_LENGTH){
    if(level >= LEVEL_THEMES.length){
      if(score > best){ best = score; localStorage.setItem(BEST_KEY, best); bestEl.textContent = best; }
      state = 'victory';
      sfxWin();
    } else {
      state = 'levelclear';
      sfxWin();
    }
  }
}

function centerText(lines, startY=120, lineH=30){
  ctx.textAlign = 'center';
  lines.forEach((l, i)=>{
    ctx.font = l.font || '16px monospace';
    ctx.fillStyle = l.color || '#eee';
    ctx.fillText(l.text, canvas.width/2, startY + i*lineH);
  });
  ctx.textAlign = 'left';
}

function draw(){
  const theme = LEVEL_THEMES[level-1] || LEVEL_THEMES[0];
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(state === 'title'){
    centerText([
      { text:'ECHO', font:'bold 44px monospace', color:'#06d6a0' },
      { text:'race against your own ghost', font:'14px monospace' },
      { text:'3 levels · sync multiplier · 3 lives', font:'12px monospace', color:'#888' },
      { text:'press SPACE to start', font:'16px monospace', color:'#ffd166' },
    ], 110, 34);
    return;
  }

  // world progress bar
  ctx.fillStyle = '#222';
  ctx.fillRect(10, 10, 100, 6);
  ctx.fillStyle = '#06d6a0';
  ctx.fillRect(10, 10, Math.min(100, 100*distance/LEVEL_LENGTH), 6);

  ctx.fillStyle = theme.ground;
  ctx.fillRect(0, GROUND_Y+24, canvas.width, 4);

  if(ghostPlayer){
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(ghostPlayer.x, ghostPlayer.y-ghostPlayer.h, ghostPlayer.w, ghostPlayer.h);
  }
  ctx.fillStyle = theme.ob;
  for(const o of obstacles) ctx.fillRect(o.x, GROUND_Y-o.h, o.w, o.h);
  ctx.fillStyle = '#ffd166';
  for(const c of coins){ if(c.collected) continue; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#06d6a0';
  ctx.fillRect(player.x, player.y-player.h, player.w, player.h);

  ctx.font = '14px monospace'; ctx.fillStyle = '#ffd166';
  for(const p of popups){ ctx.globalAlpha = Math.max(p.life/40,0); ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;

  ctx.font = '12px monospace'; ctx.fillStyle = '#888';
  ctx.fillText(theme.name, 10, 30);
  if(multiplier > 1){ ctx.fillStyle='#ffd166'; ctx.fillText('x'+multiplier, canvas.width-30, 30); }

  if(state === 'paused'){
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([{ text:'PAUSED', font:'bold 28px monospace', color:'#ffd166' },{ text:'press P to resume', font:'14px monospace' }], 140, 30);
  }
  if(state === 'dead'){
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([
      { text:'HIT!', font:'bold 28px monospace', color:'#ef476f' },
      { text:'lives left: '+lives, font:'14px monospace' },
      { text:'press SPACE to retry level', font:'14px monospace', color:'#ffd166' },
    ], 130, 30);
  }
  if(state === 'levelclear'){
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([
      { text:'LEVEL '+level+' CLEAR', font:'bold 24px monospace', color:'#06d6a0' },
      { text:'score: '+Math.floor(score/5), font:'14px monospace' },
      { text:'press SPACE for level '+(level+1), font:'14px monospace', color:'#ffd166' },
    ], 130, 30);
  }
  if(state === 'victory'){
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([
      { text:'YOU WIN', font:'bold 30px monospace', color:'#06d6a0' },
      { text:'final score: '+Math.floor(score/5), font:'16px monospace' },
      { text:'best: '+Math.floor(best/5), font:'14px monospace', color:'#ffd166' },
      { text:'press SPACE to play again', font:'14px monospace', color:'#888' },
    ], 120, 32);
  }
  if(state === 'gameover'){
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([
      { text:'GAME OVER', font:'bold 30px monospace', color:'#ef476f' },
      { text:'score: '+Math.floor(score/5), font:'16px monospace' },
      { text:'best: '+Math.floor(best/5), font:'14px monospace', color:'#ffd166' },
      { text:'press SPACE to try again', font:'14px monospace', color:'#888' },
    ], 120, 32);
  }
}

function loop(){
  if(state === 'playing') update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
