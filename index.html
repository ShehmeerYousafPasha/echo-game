<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ECHO</title>
<style>
  html,body{margin:0;background:#0d0d14;overflow:hidden;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;color:#eee}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  canvas{background:#15151f;border:3px solid #333;border-radius:6px;box-shadow:0 0 40px rgba(6,214,160,0.15)}
  #hud{display:flex;justify-content:space-between;width:480px;font-size:14px;letter-spacing:1px}
  #hud span{color:#ffd166}
  #hint{font-size:12px;color:#666}
  #wrap.shake{animation:shk 0.25s}
  @keyframes shk{0%{transform:translate(0,0)}20%{transform:translate(-6px,4px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}100%{transform:translate(0,0)}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>LIVES <span id="lives">3</span></div>
    <div>LEVEL <span id="level">1</span>/5</div>
    <div>BEST <span id="best">0</span></div>
  </div>
  <canvas id="c" width="480" height="320"></canvas>
  <div id="hint">UP / SPACE jump (hold for higher) &nbsp;|&nbsp; DOWN duck &nbsp;|&nbsp; ESC pause &nbsp;|&nbsp; cyan = shield, pink = double jump</div>
  <div id="touchHint" style="font-size:12px;color:#555;display:none">Tap top half to jump &middot; hold bottom half to duck</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const bestEl = document.getElementById('best');

const GROUND_Y = 260;
const GRAVITY = 0.6;
const JUMP_V = -11;
const LEVEL_LENGTH = 3200;

// ---- persistent high score (free, local only) ----
const BEST_KEY = 'echo_best_score';
let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
bestEl.textContent = best;

// ---- synthesized sound (no files) ----
let audioCtx = null;
function sfx(freq, dur, type='square', vol=0.08){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq; gain.gain.value = vol;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
// clock "tick" motif (Interstellar-style) instead of a plain beep
function sfxTick(pitchMul=1){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 1800 * pitchMul;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.09, t+0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, t+0.045);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.05);
}
const sfxJump = ()=>sfxTick(1);
const sfxDoubleJump = ()=>sfxTick(1.5);
const sfxCoin = ()=>{ sfx(880,0.08,'triangle'); setTimeout(()=>sfx(1320,0.08,'triangle'),40); };
const sfxSync = ()=>{ sfx(660,0.1,'sawtooth'); setTimeout(()=>sfx(990,0.15,'sawtooth'),60); };
const sfxHit  = ()=>sfx(160,0.25,'sawtooth',0.1);
const sfxShield = ()=>{ sfx(300,0.15,'sine',0.08); setTimeout(()=>sfx(450,0.15,'sine',0.08),80); };
const sfxWin  = ()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,0.2,'triangle',0.09), i*110)); };

// --- ambient Interstellar-style organ drone (two detuned low oscillators + slow swell) ---
let ambient = null;
function startAmbient(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  stopAmbient();
  const master = audioCtx.createGain();
  master.gain.value = 0;
  master.connect(audioCtx.destination);
  master.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 2);

  const freqs = [55, 55*1.5, 55*2];
  const oscs = freqs.map((f, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    osc.detune.value = (i-1) * 4;
    const g = audioCtx.createGain();
    g.gain.value = i === 0 ? 1 : 0.4;
    osc.connect(g); g.connect(master);
    osc.start();
    return osc;
  });

  // slow swell LFO on master gain for that "breathing" organ feel
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.08;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 0.015;
  lfo.connect(lfoGain); lfoGain.connect(master.gain);
  lfo.start();

  ambient = { master, oscs, lfo };
}
function stopAmbient(){
  if(!ambient) return;
  const t = audioCtx.currentTime;
  try{
    ambient.master.gain.cancelScheduledValues(t);
    ambient.master.gain.setValueAtTime(ambient.master.gain.value, t);
    ambient.master.gain.linearRampToValueAtTime(0, t+0.8);
    setTimeout(()=>{ ambient.oscs.forEach(o=>o.stop()); ambient.lfo.stop(); }, 850);
  } catch(e){}
  ambient = null;
}

// ---- game state machine ----
// states: 'title' | 'playing' | 'paused' | 'dead' | 'levelclear' | 'victory' | 'gameover'
let state = 'title';
let level = 1;
let lives = 3;
let score = 0;
let multiplier = 1;
let syncCooldown = 0;
let popups = [];
let frame = 0;
let distance = 0;
let worldSpeed = 4;

let player, obstacles, coins, powerups;
let inputLog = [], ghostLog = [], ghostPlayer = null, ghostIdx = 0, ghostDuckIdx = 0;
let duckLog = [], ghostDuckLog = [];

const LEVEL_THEMES = [
  { name: 'MEADOW', skyTop:'#2b2d5e', skyBot:'#15151f', hill:'#1f2140', ground: '#2a2a3a', ob: '#ef476f', speed: 4,   gap: 240, stars:false },
  { name: 'CANYON', skyTop:'#3a2440', skyBot:'#1a1420', hill:'#2a1a30', ground: '#3a2a3a', ob: '#f78c6b', speed: 4.6, gap: 215, stars:false },
  { name: 'VOID',   skyTop:'#101035', skyBot:'#0a0a16', hill:'#161638', ground: '#242450', ob: '#c77dff', speed: 5.2, gap: 195, stars:true },
  { name: 'STORM',  skyTop:'#241533', skyBot:'#101018', hill:'#1c1228', ground: '#2a1f3a', ob: '#ff6b9d', speed: 5.8, gap: 180, stars:true },
  { name: 'CORE',   skyTop:'#1a0a10', skyBot:'#060608', hill:'#200c10', ground: '#3a2a2a', ob: '#ffd166', speed: 6.6, gap: 165, stars:true },
];

// obstacle types: 'ground' (jump over) and 'hang' (duck under)
function makeObstacles(theme){
  let obs = [];
  let x = 500;
  while(x < LEVEL_LENGTH){
    x += theme.gap + Math.random()*80;
    const isHang = Math.random() < 0.3;
    if(isHang){
      obs.push({ x, w: 26, h: 20, hang: true, y: GROUND_Y - 46 });
    } else {
      obs.push({ x, w: 20, h: 20 + Math.random()*26, hang: false, spike: Math.random() < 0.5 });
    }
  }
  return obs;
}

// background stars for later levels
let stars = [];
for(let i=0;i<60;i++){ stars.push({ x: Math.random()*480, y: Math.random()*220, s: Math.random()*1.5+0.5 }); }

// parallax hill silhouettes
let hills = [];
for(let i=0;i<6;i++){ hills.push({ x: i*160, w: 140+Math.random()*60, h: 40+Math.random()*50 }); }

// particle trail behind the player
let particles = [];
function spawnTrail(p){
  particles.push({ x:p.x+p.w/2, y:p.y-p.h/2, life:16, vx:-worldSpeed*0.3-Math.random(), vy:(Math.random()-0.5), c:'#06d6a0', size:3 });
}
function spawnBurst(x, y, color, count=14){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, sp = 1+Math.random()*3;
    particles.push({ x, y, life:30, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, c:color, size:3 });
  }
}

let shakeFrames = 0;
const wrapEl = document.getElementById('wrap');
function makeCoins(theme){
  let coins = [];
  let x = 420;
  while(x < LEVEL_LENGTH){
    x += 170 + Math.random()*60;
    coins.push({ x, y: GROUND_Y - 50 - Math.random()*40, r: 6, collected: false });
  }
  return coins;
}
function makePowerups(theme){
  let pu = [];
  let x = 700;
  while(x < LEVEL_LENGTH){
    x += 500 + Math.random()*400;
    const type = Math.random() < 0.5 ? 'shield' : 'jump2';
    pu.push({ x, y: GROUND_Y - 60, r: 9, collected: false, type });
  }
  return pu;
}

function newPlayer(){ return { x: 60, y: GROUND_Y, vy: 0, w: 24, h: 24, onGround: true, ducking:false, hasShield:false, doubleJumpAvailable:false, usedDoubleJump:false }; }

function startLevel(keepGhost){
  const theme = LEVEL_THEMES[level-1];
  worldSpeed = theme.speed;
  distance = 0; frame = 0;
  player = newPlayer();
  obstacles = makeObstacles(theme);
  coins = makeCoins(theme);
  powerups = makePowerups(theme);
  multiplier = 1; syncCooldown = 0; popups = [];
  if(keepGhost && inputLog.length){ ghostLog = inputLog.slice(); ghostDuckLog = duckLog.slice(); }
  inputLog = []; duckLog = [];
  if(ghostLog.length){ ghostPlayer = newPlayer(); ghostIdx = 0; ghostDuckIdx = 0; } else { ghostPlayer = null; }
  particles = [];
  state = 'playing';
}

function startGame(){
  level = 1; lives = 3; score = 0;
  ghostLog = []; ghostPlayer = null;
  livesEl.textContent = lives;
  levelEl.textContent = level;
  scoreEl.textContent = score;
  startLevel(false);
  startAmbient();
}

function jump(p){
  if(p.onGround){
    p.vy = JUMP_V; p.onGround = false; p.usedDoubleJump = false;
    return 'ground';
  } else if(p.doubleJumpAvailable && !p.usedDoubleJump){
    p.vy = JUMP_V * 0.85; p.usedDoubleJump = true;
    return 'double';
  }
  return null;
}
function physics(p){
  // fall faster than you rise - snappier, more "real" platformer feel
  p.vy += p.vy > 0 ? GRAVITY * 1.5 : GRAVITY;
  p.y += p.vy;
  if(p.y >= GROUND_Y){ p.y = GROUND_Y; p.vy = 0; p.onGround = true; }
}
function rectsOverlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

window.addEventListener('keydown', (e)=>{
  if(e.code === 'Escape' && (state === 'playing' || state === 'paused')){
    e.preventDefault();
    state = state === 'playing' ? 'paused' : 'playing';
    return;
  }
  if(e.code !== 'Space' && e.code !== 'ArrowUp') return;
  e.preventDefault();

  if(state === 'title'){ startGame(); return; }
  if(state === 'dead'){ // lost a life, same level, ghost carries over
    startLevel(true); return;
  }
  if(state === 'levelclear'){
    level++;
    levelEl.textContent = level;
    startLevel(true);
    return;
  }
  if(state === 'victory' || state === 'gameover'){ startGame(); return; }
  if(state === 'playing'){
    inputLog.push(frame);
    const result = jump(player);
    if(result === 'double') sfxDoubleJump();
    else if(result === 'ground') sfxJump();
  }
});
window.addEventListener('keyup', (e)=>{
  if((e.code === 'Space' || e.code === 'ArrowUp') && player && player.vy < -2){
    player.vy *= 0.45; // short-hop: release early for a lower jump
  }
});

// touch controls: tap top half = jump, hold bottom half = duck
if('ontouchstart' in window){
  document.getElementById('touchHint').style.display = 'block';
  canvas.addEventListener('touchstart', (e)=>{
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touchY = e.touches[0].clientY - rect.top;
    if(state === 'title' || state === 'dead' || state === 'levelclear' || state === 'victory' || state === 'gameover'){
      window.dispatchEvent(new KeyboardEvent('keydown', { code:'Space' }));
      return;
    }
    if(touchY > canvas.height/2){
      player.ducking = true;
      duckLog.push({ frame, down: true });
    } else {
      inputLog.push(frame);
      const result = jump(player);
      if(result === 'double') sfxDoubleJump();
      else if(result === 'ground') sfxJump();
    }
  }, { passive:false });
  canvas.addEventListener('touchend', (e)=>{
    e.preventDefault();
    if(player && player.ducking){
      player.ducking = false;
      duckLog.push({ frame, down: false });
    }
    if(player && player.vy < -2) player.vy *= 0.45;
  }, { passive:false });
}
window.addEventListener('keydown', (e)=>{
  if(e.code === 'ArrowDown' && state === 'playing' && !player.ducking){
    player.ducking = true;
    duckLog.push({ frame, down: true });
  }
});
window.addEventListener('keyup', (e)=>{
  if(e.code === 'ArrowDown' && state === 'playing' && player.ducking){
    player.ducking = false;
    duckLog.push({ frame, down: false });
  }
});

function endRunLoseLife(){
  lives--;
  livesEl.textContent = lives;
  sfxHit();
  spawnBurst(player.x+player.w/2, player.y-player.h/2, '#ef476f', 20);
  wrapEl.classList.remove('shake'); void wrapEl.offsetWidth; wrapEl.classList.add('shake');
  if(lives <= 0){
    if(score > best){ best = score; localStorage.setItem(BEST_KEY, best); bestEl.textContent = best; }
    state = 'gameover';
    stopAmbient();
  } else {
    state = 'dead';
  }
}

function update(){
  frame++;
  distance += worldSpeed;
  score += 1 * multiplier;
  scoreEl.textContent = Math.floor(score/5);

  // ambient ticking clock, tempo rises as the level progresses (Interstellar tension motif)
  const progress = distance / LEVEL_LENGTH;
  const tickInterval = Math.max(10, 36 - level*3 - progress*14);
  if(frame % Math.round(tickInterval) === 0){
    sfxTick(0.5 + progress*0.3);
  }

  physics(player);
  if(frame % 3 === 0) spawnTrail(player);
  for(const pt of particles){ pt.x += pt.vx; pt.y += pt.vy; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);

  if(ghostPlayer){
    if(ghostIdx < ghostLog.length && ghostLog[ghostIdx] === frame){ jump(ghostPlayer); ghostIdx++; }
    while(ghostDuckIdx < ghostDuckLog.length && ghostDuckLog[ghostDuckIdx].frame === frame){
      ghostPlayer.ducking = ghostDuckLog[ghostDuckIdx].down;
      ghostDuckIdx++;
    }
    physics(ghostPlayer);
    if(syncCooldown > 0) syncCooldown--;
    const bothAir = !player.onGround && !ghostPlayer.onGround;
    const close = Math.abs(player.y - ghostPlayer.y) < 18;
    if(bothAir && close && syncCooldown === 0){
      multiplier = Math.min(multiplier + 1, 5);
      syncCooldown = 60;
      popups.push({ x: player.x, y: player.y - 50, text: 'SYNC x'+multiplier, life: 40 });
      sfxSync();
    }
  } else {
    multiplier = 1;
  }

  for(const o of obstacles) o.x -= worldSpeed;
  for(const c of coins) c.x -= worldSpeed;
  for(const pu of powerups) pu.x -= worldSpeed;

  const pH = player.ducking ? 12 : player.h;
  const pBox = { x: player.x, y: player.y - pH, w: player.w, h: pH };
  for(const o of obstacles){
    if(o.passed) continue;
    const oBox = o.hang
      ? { x: o.x, y: o.y, w: o.w, h: o.h }
      : { x: o.x, y: GROUND_Y - o.h, w: o.w, h: o.h };
    if(rectsOverlap(pBox, oBox)){
      if(player.hasShield){
        player.hasShield = false;
        o.passed = true;
        sfxShield();
        popups.push({ x: player.x, y: player.y - 50, text: 'SHIELD BROKE', life: 30 });
      } else {
        endRunLoseLife(); return;
      }
    }
  }

  for(const pu of powerups){
    if(pu.collected) continue;
    const dx = (player.x+player.w/2)-pu.x, dy=(player.y-player.h/2)-pu.y;
    if(Math.sqrt(dx*dx+dy*dy) < 18){
      pu.collected = true;
      if(pu.type === 'shield'){
        player.hasShield = true;
        popups.push({ x: pu.x, y: pu.y, text: 'SHIELD UP', life: 35 });
      } else {
        player.doubleJumpAvailable = true;
        popups.push({ x: pu.x, y: pu.y, text: 'DOUBLE JUMP', life: 35 });
      }
      sfxShield();
    }
  }
  for(const c of coins){
    if(c.collected) continue;
    const dx = (player.x+player.w/2)-c.x, dy=(player.y-player.h/2)-c.y;
    if(Math.sqrt(dx*dx+dy*dy) < 16){
      c.collected = true;
      score += 20*multiplier;
      popups.push({ x:c.x, y:c.y, text:'+'+(20*multiplier), life:30 });
      sfxCoin();
    }
  }
  popups = popups.filter(p => (p.life-- > 0));

  if(distance >= LEVEL_LENGTH){
    if(level >= LEVEL_THEMES.length){
      if(score > best){ best = score; localStorage.setItem(BEST_KEY, best); bestEl.textContent = best; }
      state = 'victory';
      sfxWin();
      stopAmbient();
    } else {
      state = 'levelclear';
      sfxWin();
    }
  }
}

function centerText(lines, startY=120, lineH=30){
  ctx.textAlign = 'center';
  lines.forEach((l, i)=>{
    ctx.font = l.font || '16px monospace';
    ctx.fillStyle = l.color || '#eee';
    ctx.fillText(l.text, canvas.width/2, startY + i*lineH);
  });
  ctx.textAlign = 'left';
}

function draw(){
  const theme = LEVEL_THEMES[level-1] || LEVEL_THEMES[0];
  const grad = ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0, theme.skyTop);
  grad.addColorStop(1, theme.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(state === 'title'){
    centerText([
      { text:'ECHO', font:'bold 44px monospace', color:'#06d6a0' },
      { text:'race against your own ghost', font:'14px monospace' },
      { text:'5 levels · sync multiplier · duck + jump · 3 lives', font:'12px monospace', color:'#888' },
      { text:'press SPACE to start', font:'16px monospace', color:'#ffd166' },
    ], 110, 34);
    return;
  }

  // world progress bar
  ctx.fillStyle = '#222';
  ctx.fillRect(10, 10, 100, 6);
  ctx.fillStyle = '#06d6a0';
  ctx.fillRect(10, 10, Math.min(100, 100*distance/LEVEL_LENGTH), 6);

  if(theme.stars){
    ctx.fillStyle = '#fff';
    for(const s of stars){
      s.x -= worldSpeed*0.15; if(s.x < 0) s.x = canvas.width;
      ctx.globalAlpha = 0.5; ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  // parallax hills
  ctx.fillStyle = theme.hill;
  for(const h of hills){
    h.x -= worldSpeed*0.25; if(h.x < -h.w) h.x += hills.length*160;
    ctx.beginPath();
    ctx.moveTo(h.x, GROUND_Y+24);
    ctx.quadraticCurveTo(h.x+h.w/2, GROUND_Y+24-h.h, h.x+h.w, GROUND_Y+24);
    ctx.fill();
  }

  // ground with lane texture
  ctx.fillStyle = theme.ground;
  ctx.fillRect(0, GROUND_Y+24, canvas.width, 6);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  ctx.setLineDash([14,10]);
  ctx.lineDashOffset = -distance;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y+27);
  ctx.lineTo(canvas.width, GROUND_Y+27);
  ctx.stroke();
  ctx.setLineDash([]);

  // particle trail / bursts
  for(const pt of particles){
    ctx.globalAlpha = Math.max(pt.life/30, 0) * 0.7;
    ctx.fillStyle = pt.c || '#06d6a0';
    const s = pt.size || 3;
    ctx.fillRect(pt.x, pt.y, s, s);
  }
  ctx.globalAlpha = 1;

  if(ghostPlayer){
    const gh = ghostPlayer.ducking ? 12 : ghostPlayer.h;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(ghostPlayer.x, ghostPlayer.y-gh, ghostPlayer.w, gh);
  }
  ctx.fillStyle = theme.ob;
  for(const o of obstacles){
    if(o.hang){
      ctx.fillRect(o.x, o.y, o.w, o.h);
    } else if(o.spike){
      ctx.beginPath();
      ctx.moveTo(o.x, GROUND_Y);
      ctx.lineTo(o.x+o.w/2, GROUND_Y-o.h);
      ctx.lineTo(o.x+o.w, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillRect(o.x, GROUND_Y-o.h, o.w, o.h);
    }
  }

  // coins with glow + spin shimmer
  for(const c of coins){
    if(c.collected) continue;
    ctx.save();
    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#ffd166';
    const squish = Math.abs(Math.sin(frame*0.1 + c.x));
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r*squish+2, c.r, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  for(const pu of powerups){
    if(pu.collected) continue;
    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.rotate(frame*0.05);
    const col = pu.type === 'shield' ? '#4cc9f0' : '#f72585';
    ctx.shadowColor = col; ctx.shadowBlur = 12;
    ctx.fillStyle = col;
    ctx.fillRect(-pu.r, -pu.r, pu.r*2, pu.r*2);
    ctx.restore();
  }

  // player sprite: rounded body + visor, leans forward slightly, duck squashes it
  const ph = player.ducking ? 12 : player.h;
  const px = player.x, py = player.y - ph;
  ctx.save();
  if(player.hasShield){
    ctx.shadowColor = '#4cc9f0'; ctx.shadowBlur = 14;
  }
  ctx.fillStyle = player.hasShield ? '#4cc9f0' : '#06d6a0';
  const r = 6;
  ctx.beginPath();
  ctx.moveTo(px+r, py);
  ctx.arcTo(px+player.w, py, px+player.w, py+ph, r);
  ctx.arcTo(px+player.w, py+ph, px, py+ph, r);
  ctx.arcTo(px, py+ph, px, py, r);
  ctx.arcTo(px, py, px+player.w, py, r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  // visor
  ctx.fillStyle = 'rgba(10,10,20,0.6)';
  ctx.fillRect(px+player.w*0.45, py+ph*0.2, player.w*0.5, ph*0.3);

  // animated running legs (only when grounded and not ducking)
  if(player.onGround && !player.ducking){
    const legPhase = Math.sin(frame*0.5);
    ctx.strokeStyle = player.hasShield ? '#4cc9f0' : '#06d6a0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px+6, py+ph);
    ctx.lineTo(px+6+legPhase*5, py+ph+7);
    ctx.moveTo(px+player.w-6, py+ph);
    ctx.lineTo(px+player.w-6-legPhase*5, py+ph+7);
    ctx.stroke();
  }
  if(player.hasShield){
    ctx.strokeStyle = 'rgba(76,201,240,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px+player.w/2, py+ph/2, Math.max(player.w,ph)*0.9, 0, Math.PI*2);
    ctx.stroke();
  }

  ctx.font = '14px monospace'; ctx.fillStyle = '#ffd166';
  for(const p of popups){ ctx.globalAlpha = Math.max(p.life/40,0); ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;

  ctx.font = '12px monospace'; ctx.fillStyle = '#888';
  ctx.fillText(theme.name, 10, 30);
  if(multiplier > 1){ ctx.fillStyle='#ffd166'; ctx.fillText('x'+multiplier, canvas.width-30, 30); }

  // cinematic vignette
  const vg = ctx.createRadialGradient(canvas.width/2,canvas.height/2,120,canvas.width/2,canvas.height/2,320);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(state === 'paused'){
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([{ text:'PAUSED', font:'bold 28px monospace', color:'#ffd166' },{ text:'press P to resume', font:'14px monospace' }], 140, 30);
  }
  if(state === 'dead'){
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([
      { text:'HIT!', font:'bold 28px monospace', color:'#ef476f' },
      { text:'lives left: '+lives, font:'14px monospace' },
      { text:'press SPACE to retry level', font:'14px monospace', color:'#ffd166' },
    ], 130, 30);
  }
  if(state === 'levelclear'){
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([
      { text:'LEVEL '+level+' CLEAR', font:'bold 24px monospace', color:'#06d6a0' },
      { text:'score: '+Math.floor(score/5), font:'14px monospace' },
      { text:'press SPACE for level '+(level+1), font:'14px monospace', color:'#ffd166' },
    ], 130, 30);
  }
  if(state === 'victory'){
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([
      { text:'YOU WIN', font:'bold 30px monospace', color:'#06d6a0' },
      { text:'final score: '+Math.floor(score/5), font:'16px monospace' },
      { text:'best: '+Math.floor(best/5), font:'14px monospace', color:'#ffd166' },
      { text:'press SPACE to play again', font:'14px monospace', color:'#888' },
    ], 120, 32);
  }
  if(state === 'gameover'){
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    centerText([
      { text:'GAME OVER', font:'bold 30px monospace', color:'#ef476f' },
      { text:'score: '+Math.floor(score/5), font:'16px monospace' },
      { text:'best: '+Math.floor(best/5), font:'14px monospace', color:'#ffd166' },
      { text:'press SPACE to try again', font:'14px monospace', color:'#888' },
    ], 120, 32);
  }
}

function loop(){
  if(state === 'playing') update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
