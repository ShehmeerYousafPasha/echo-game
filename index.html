<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="ECHO — a free browser runner where you race against a recorded ghost of your own last attempt.">
<meta name="theme-color" content="#0d0d14">
<meta name="author" content="SYP">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2315151f'/%3E%3Crect x='28' y='28' width='44' height='44' rx='10' fill='%2306d6a0'/%3E%3C/svg%3E">
<title>ECHO — race your own ghost</title>
<style>
  :root{
    --bg-deep:#07070c; --panel:#13131c; --panel-edge:#2a2a3a;
    --accent:#06d6a0; --accent-dim:#0a8f6c; --warn:#ffd166; --danger:#ef476f;
    --shield:#4cc9f0; --jump2:#f72585; --text:#eaeaf0; --text-dim:#7a7a8c;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; min-height:100%; overflow-x:hidden;
    background:#07070c;
    color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:18px;
    position:relative;
  }

  /* full-viewport cosmic backdrop behind the game panel - pure CSS, no JS cost */
  #bgfx{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:radial-gradient(circle at 50% -10%, #241a3a 0%, #07070c 55%, #020203 100%);
  }
  #bgfx .nebula{
    position:absolute; border-radius:50%; filter:blur(60px); opacity:0.35;
    animation: drift 40s ease-in-out infinite alternate;
  }
  #bgfx .n1{ width:420px; height:420px; background:#4a2e6a; top:-120px; left:-100px; animation-duration:46s; }
  #bgfx .n2{ width:360px; height:360px; background:#1c3a5e; bottom:-140px; right:-80px; animation-duration:55s; animation-direction:alternate-reverse; }
  #bgfx .n3{ width:300px; height:300px; background:#6a2e4a; top:30%; right:-120px; animation-duration:38s; }
  @keyframes drift{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(40px,-30px) scale(1.15); }
  }
  #bgfx .starfield{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, #fff, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 85% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 40%, #fff, transparent),
      radial-gradient(1px 1px at 10% 65%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 95% 85%, #fff, transparent),
      radial-gradient(1px 1px at 30% 10%, #fff, transparent),
      radial-gradient(1px 1px at 65% 92%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 5% 90%, #fff, transparent);
    background-repeat:repeat; background-size:340px 340px;
    opacity:0.5; animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ 0%{opacity:0.35} 100%{opacity:0.65} }

  #app{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:520px; }

  #watermark{
    position:fixed; bottom:10px; right:14px; z-index:2; pointer-events:none;
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:2px;
    color:rgba(255,255,255,0.08); text-transform:uppercase; user-select:none;
  }

  header{ text-align:center; }
  header h1{
    margin:0; font-family:'Courier New',monospace; font-size:clamp(28px,7vw,40px);
    letter-spacing:6px; color:var(--accent);
    text-shadow:0 0 18px rgba(6,214,160,0.55), 0 0 2px rgba(6,214,160,0.9);
  }
  header p{ margin:4px 0 0; font-size:12.5px; color:var(--text-dim); letter-spacing:0.5px; }
  header p.credit{ margin-top:8px; font-size:10.5px; color:#55556a; letter-spacing:1px; text-transform:uppercase; }

  #panel{
    width:100%; background:linear-gradient(180deg,var(--panel),#0e0e16);
    border:1px solid var(--panel-edge); border-radius:16px; padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  #hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:13px; }
  .hud-group{ display:flex; align-items:center; gap:10px; }
  .hud-stat{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.1; }
  .hud-stat .label{ font-size:9px; letter-spacing:1.5px; color:var(--text-dim); text-transform:uppercase; }
  .hud-stat .value{ font-size:16px; font-weight:700; color:var(--warn); font-variant-numeric:tabular-nums; }
  #hearts{ display:flex; gap:5px; }
  #hearts svg{ width:18px; height:18px; display:block; filter:drop-shadow(0 0 4px rgba(239,71,111,0.6)); transition:opacity .2s, transform .2s; }
  #hearts svg.lost{ opacity:0.2; filter:none; transform:scale(0.85); }

  #powerupStatus{ display:flex; gap:6px; }
  .pu-badge{
    width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#0007; background:#2a2a3a; opacity:0.35; transition:all .2s;
  }
  .pu-badge.active{ opacity:1; box-shadow:0 0 10px currentColor; color:#000; }
  .pu-badge.shield{ background:var(--shield); color:var(--shield); }
  .pu-badge.shield.active{ background:var(--shield); }
  .pu-badge.jump2{ background:var(--jump2); color:var(--jump2); }
  .pu-badge.jump2.active{ background:var(--jump2); }

  #canvasWrap{ position:relative; width:100%; border-radius:10px; overflow:hidden; line-height:0; touch-action:none; }
  #canvasWrap.shake{ animation:shk 0.25s; }
  canvas{ display:block; width:100%; height:auto; background:#15151f; touch-action:none; }

  @keyframes shk{
    0%{transform:translate(0,0)} 20%{transform:translate(-6px,4px)}
    40%{transform:translate(6px,-4px)} 60%{transform:translate(-4px,2px)}
    80%{transform:translate(4px,-2px)} 100%{transform:translate(0,0)}
  }

  #controlsBar{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:8px; flex-wrap:wrap; }
  #hint{ font-size:11px; color:var(--text-dim); }
  #hint b{ color:var(--text); }
  .iconbtn{
    background:#1d1d2c; border:1px solid var(--panel-edge); color:var(--text-dim);
    border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .iconbtn:hover{ color:var(--text); border-color:var(--accent-dim); }

  #touchControls{ display:none; width:100%; justify-content:space-between; margin-top:10px; gap:10px; }
  #touchControls button{
    flex:1; padding:16px 0; font-size:14px; font-weight:700; letter-spacing:1px;
    border-radius:12px; border:1px solid var(--panel-edge); background:#1a1a28; color:var(--text);
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  #touchControls button:active{ background:var(--accent); color:#001b14; }
  #duckBtn:active{ background:var(--shield); color:#001b2a; }

  footer{ font-size:10.5px; color:#44445a; text-align:center; }

  @media (hover:none) and (pointer:coarse){
    #touchControls{ display:flex; }
    #hint{ display:none; }
  }
</style>
</head>
<body>
<div id="bgfx">
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div class="starfield"></div>
</div>
<div id="app">
  <header>
    <h1>ECHO</h1>
    <p>dust · gravity · your own echo</p>
  </header>

  <div id="panel">
    <div id="hud">
      <div class="hud-group">
        <div class="hud-stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="hud-stat">
          <span class="label">Best</span>
          <span class="value" id="best">0</span>
        </div>
      </div>
      <div class="hud-group">
        <div id="powerupStatus">
          <div class="pu-badge shield" id="badgeShield" title="Shield">S</div>
          <div class="pu-badge jump2" id="badgeJump2" title="Double jump">D</div>
        </div>
        <div id="hearts"></div>
      </div>
      <div class="hud-stat" style="align-items:flex-end">
        <span class="label">Level</span>
        <span class="value"><span id="level">1</span>/<span id="levelMax">5</span></span>
      </div>
    </div>

    <div id="canvasWrap">
      <canvas id="c" width="480" height="320"></canvas>
    </div>

    <div id="controlsBar">
      <div id="hint">
        <b>&uarr; / Space</b> jump &middot; <b>&darr;</b> duck &middot; <b>Esc</b> pause &middot; cyan = shield, pink = double jump
      </div>
      <button class="iconbtn" id="pauseBtn">Pause</button>
    </div>

    <div id="touchControls">
      <button id="duckBtn">DUCK &darr;</button>
      <button id="jumpBtn">JUMP &uarr;</button>
    </div>
  </div>

  <footer>Free &middot; offline &middot; no accounts &middot; your best score is saved on this device &middot; &copy; SYP</footer>
</div>
<div id="watermark">Shehmeer</div>
<script>
'use strict';

// =========================================================================
// ECHO — a runner where you race against a recorded ghost of your own
// last attempt. Free, offline, single-file, no external assets.
// =========================================================================

// ---------------------------------------------------------------- CONSTANTS
const LOGICAL_W = 480, LOGICAL_H = 320; // design-space resolution; all game math uses this
const GROUND_Y = 260;
const GRAVITY = 0.6;
const FALL_GRAVITY_MULT = 1.5;   // fall faster than you rise -> snappier jumps
const JUMP_V = -11;
const DOUBLE_JUMP_V = JUMP_V * 0.85;
const SHORT_HOP_DAMP = 0.45;     // releasing jump early cuts the arc short
const LEVEL_LENGTH = 3200;
const PLAYER_W = 24, PLAYER_H = 24, DUCK_H = 12;
const SYNC_DISTANCE = 18;        // how close player+ghost must be, mid-air, to sync
const SYNC_COOLDOWN = 60;
const MAX_MULTIPLIER = 5;
const BEST_KEY = 'echo_best_score';

// a space-and-time journey, in the emotional register of cosmic sci-fi —
// original names/palettes, not reproductions of any specific film's assets
const LEVEL_THEMES = [
  { name:'DUSTBOWL',      skyTop:'#4a3a28', skyBot:'#1a140c', hill:'#2e2416', ground:'#3a2e1c', ob:'#c9823c', speed:4.0, gap:240, stars:false, fx:'dust'      },
  { name:'LIFTOFF',       skyTop:'#1c2b4a', skyBot:'#0a0e1a', hill:'#16203a', ground:'#232c3a', ob:'#5dade2', speed:4.6, gap:215, stars:true,  fx:'stars'     },
  { name:'WORMHOLE',      skyTop:'#2a1a3a', skyBot:'#0a0616', hill:'#201630', ground:'#2a2050', ob:'#c77dff', speed:5.2, gap:195, stars:true,  fx:'wormhole'  },
  { name:'EVENT HORIZON', skyTop:'#1a0f1a', skyBot:'#05030a', hill:'#1c1028', ground:'#2a1f3a', ob:'#ff6b9d', speed:5.8, gap:180, stars:true,  fx:'horizon'   },
  { name:'SINGULARITY',   skyTop:'#120208', skyBot:'#020103', hill:'#1a0810', ground:'#3a2a2a', ob:'#ffd166', speed:6.6, gap:165, stars:true,  fx:'singularity' },
];
// how far past the level length the finish line starts, so it scrolls into
// view and reaches the player right as the level actually completes
const FINISH_LEAD = 80;

// ------------------------------------------------------------------- DOM
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// render at native device pixel density so everything stays sharp when the
// canvas is stretched larger by CSS (fixes blur, including on moving sprites)
const DPR = Math.min(window.devicePixelRatio || 1, 3);
canvas.width = LOGICAL_W * DPR;
canvas.height = LOGICAL_H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
ctx.imageSmoothingEnabled = true;
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const levelMaxEl = document.getElementById('levelMax');
const bestEl = document.getElementById('best');
const wrapEl = document.getElementById('canvasWrap');
const heartsEl = document.getElementById('hearts');
const badgeShieldEl = document.getElementById('badgeShield');
const badgeJump2El = document.getElementById('badgeJump2');
const pauseBtn = document.getElementById('pauseBtn');
levelMaxEl.textContent = LEVEL_THEMES.length;

const HEART_SVG = '<svg viewBox="0 0 24 24" fill="#ef476f"><path d="M12 21s-7.5-4.6-10.2-9.3C.3 8.9 1.6 5.4 4.8 4.4c2-.6 4 .1 5.2 1.8 1.2-1.7 3.2-2.4 5.2-1.8 3.2 1 4.5 4.5 3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
function renderHearts(){
  heartsEl.innerHTML = '';
  for(let i=0;i<3;i++){
    const wrap = document.createElement('div');
    wrap.innerHTML = HEART_SVG;
    const svg = wrap.firstElementChild;
    if(i >= lives) svg.classList.add('lost');
    heartsEl.appendChild(svg);
  }
}
function renderPowerupBadges(){
  badgeShieldEl.classList.toggle('active', !!(player && player.hasShield));
  badgeJump2El.classList.toggle('active', !!(player && player.doubleJumpAvailable));
}

// --------------------------------------------------------- PERSISTENCE
let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
bestEl.textContent = Math.floor(best/5);

function saveBestIfRecord(){
  if(score > best){
    best = score;
    localStorage.setItem(BEST_KEY, best);
    bestEl.textContent = Math.floor(best/5);
  }
}

// ----------------------------------------------------------- AUDIO (free, synthesized, no files)
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function sfx(freq, dur, type='square', vol=0.08){
  try{
    const ac = ensureAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type; osc.frequency.value = freq; gain.gain.value = vol;
    osc.connect(gain); gain.connect(ac.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    osc.stop(ac.currentTime + dur);
  } catch(e){ /* audio unsupported/blocked - game still works silently */ }
}
// a short "clock tick" instead of a generic beep (Interstellar-style motif,
// original/synthesized - not a reproduction of any copyrighted score)
function sfxTick(pitchMul=1){
  try{
    const ac = ensureAudio();
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1800 * pitchMul;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.09, t+0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.045);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t); osc.stop(t+0.05);
  } catch(e){}
}
const sfxJump       = () => sfxTick(1);
const sfxDoubleJump = () => sfxTick(1.5);
const sfxCoin       = () => { sfx(880,0.08,'triangle'); setTimeout(()=>sfx(1320,0.08,'triangle'),40); };
const sfxSync       = () => { sfx(660,0.1,'sawtooth'); setTimeout(()=>sfx(990,0.15,'sawtooth'),60); };
const sfxHit        = () => sfx(160,0.25,'sawtooth',0.1);
const sfxPickup     = () => { sfx(300,0.15,'sine',0.08); setTimeout(()=>sfx(450,0.15,'sine',0.08),80); };
const sfxWin        = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,0.2,'triangle',0.09), i*110));
// a fuller fanfare for completing the entire journey, not just one level
const sfxVictory     = () => [392,523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>sfx(f,0.35,'triangle',0.1), i*140));

// ambient organ-pad drone + slow swell (original composition, not a cover)
let ambient = null;
function startAmbient(){
  const ac = ensureAudio();
  stopAmbient();
  const master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(0.055, ac.currentTime + 3);

  // low organ-like pad: root + fifth + octave, each with a touch of detune
  // for a "breathing" chorus effect (original composition, no sampled audio)
  const padFreqs = [55, 55*1.5, 55*2, 55*3];
  const oscs = padFreqs.map((freq, i) => {
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.detune.value = (i-1.5) * 3;
    const g = ac.createGain();
    g.gain.value = [1, 0.4, 0.3, 0.15][i];
    osc.connect(g); g.connect(master);
    osc.start();
    return osc;
  });

  // a slow, high, sparse overtone that fades in and out - distant, cosmic
  const highOsc = ac.createOscillator();
  highOsc.type = 'sine';
  highOsc.frequency.value = 55*6;
  const highGain = ac.createGain();
  highGain.gain.value = 0;
  highOsc.connect(highGain); highGain.connect(master);
  highOsc.start();
  const highLfo = ac.createOscillator();
  highLfo.frequency.value = 0.03;
  const highLfoGain = ac.createGain();
  highLfoGain.gain.value = 0.02;
  highLfo.connect(highLfoGain); highLfoGain.connect(highGain.gain);
  highLfo.start();

  // slow swell LFO on master gain - the "breathing" organ feel
  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.07;
  const lfoGain = ac.createGain();
  lfoGain.gain.value = 0.018;
  lfo.connect(lfoGain); lfoGain.connect(master.gain);
  lfo.start();

  ambient = { master, oscs: [...oscs, highOsc], lfos: [lfo, highLfo] };
}
function stopAmbient(){
  if(!ambient) return;
  const ac = ensureAudio();
  const t = ac.currentTime;
  try{
    ambient.master.gain.cancelScheduledValues(t);
    ambient.master.gain.setValueAtTime(ambient.master.gain.value, t);
    ambient.master.gain.linearRampToValueAtTime(0, t+0.8);
    const toStop = ambient;
    setTimeout(()=>{
      toStop.oscs.forEach(o=>o.stop());
      toStop.lfos.forEach(l=>l.stop());
    }, 850);
  } catch(e){}
  ambient = null;
}

// -------------------------------------------------------- GAME STATE
// 'title' | 'playing' | 'paused' | 'dead' | 'levelclear' | 'victory' | 'gameover'
let state = 'title';
let uiTick = 0; // advances every drawn frame regardless of play state - drives victory fireworks
let level = 1, lives = 3, score = 0;
let multiplier = 1, syncCooldown = 0;
let frame = 0, distance = 0, worldSpeed = LEVEL_THEMES[0].speed;
let finishLineX = 0;

let player, ghostPlayer;
let obstacles, coins, powerups, popups, particles;
let inputLog, duckLog, ghostLog, ghostDuckLog, ghostIdx, ghostDuckIdx;

const stars = Array.from({length:60}, () => ({
  x: Math.random()*480, y: Math.random()*220, s: Math.random()*1.5+0.5
}));
const hills = Array.from({length:6}, (_, i) => ({
  x: i*160, w: 140+Math.random()*60, h: 40+Math.random()*50
}));

// --------------------------------------------------------- ENTITY FACTORIES
function newPlayer(){
  return {
    x: 60, y: GROUND_Y, vy: 0, w: PLAYER_W, h: PLAYER_H,
    onGround: true, ducking: false, duckAmount: 0, jumpBuffer: 0,
    hasShield: false, doubleJumpAvailable: false, usedDoubleJump: false,
    squash: 1, // visual-only squash/stretch factor, eases back to 1
  };
}

// no obstacle/coin/power-up may spawn past this point, so the stretch
// leading up to the finish line is always clear
const SPAWN_LIMIT = LEVEL_LENGTH - 60;

function makeObstacles(theme){
  const list = [];
  let x = 500;
  while(x < SPAWN_LIMIT){
    x += theme.gap + Math.random()*80;
    if(x >= SPAWN_LIMIT) break;
    if(Math.random() < 0.3){
      // positioned so a standing player's head clearly clips it, but a
      // ducking player (DUCK_H tall) clears it with a safe margin
      list.push({ x, w:26, h:20, hang:true, y: GROUND_Y-34, passed:false });
    } else {
      list.push({ x, w:20, h:20+Math.random()*26, hang:false, spike: Math.random()<0.5, passed:false });
    }
  }
  return list;
}
function makeCoins(){
  const list = [];
  let x = 420;
  while(x < SPAWN_LIMIT){
    x += 170 + Math.random()*60;
    if(x >= SPAWN_LIMIT) break;
    list.push({ x, y: GROUND_Y-50-Math.random()*40, r:6, collected:false, phase: Math.random()*Math.PI*2 });
  }
  return list;
}
function makePowerups(){
  const list = [];
  let x = 700;
  while(x < SPAWN_LIMIT){
    x += 500 + Math.random()*400;
    if(x >= SPAWN_LIMIT) break;
    list.push({ x, y: GROUND_Y-60, r:9, collected:false, type: Math.random()<0.5 ? 'shield' : 'jump2' });
  }
  return list;
}

function spawnTrail(p){
  particles.push({ x:p.x+p.w/2, y:p.y-p.h/2, life:16, vx:-worldSpeed*0.3-Math.random(), vy:(Math.random()-0.5), c:'#06d6a0', size:3 });
}
function spawnBurst(x, y, color, count=14){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, sp = 1+Math.random()*3;
    particles.push({ x, y, life:30, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, c:color, size:3 });
  }
}

// ------------------------------------------------------------- FLOW CONTROL
function startLevel(keepGhost){
  const theme = LEVEL_THEMES[level-1];
  worldSpeed = theme.speed;
  distance = 0; frame = 0;
  finishLineX = LEVEL_LENGTH + FINISH_LEAD;

  player = newPlayer();
  obstacles = makeObstacles(theme);
  coins = makeCoins();
  powerups = makePowerups();
  multiplier = 1; syncCooldown = 0;
  popups = []; particles = [];
  renderPowerupBadges();

  if(keepGhost && inputLog && inputLog.length){
    ghostLog = inputLog.slice();
    ghostDuckLog = duckLog.slice();
  }
  inputLog = []; duckLog = [];
  if(ghostLog && ghostLog.length){
    ghostPlayer = newPlayer();
    ghostIdx = 0; ghostDuckIdx = 0;
  } else {
    ghostPlayer = null;
  }
  state = 'playing';
}

function startGame(){
  level = 1; lives = 3; score = 0;
  ghostLog = []; ghostDuckLog = []; ghostPlayer = null;
  renderHearts();
  levelEl.textContent = level;
  scoreEl.textContent = 0;
  startLevel(false);
  startAmbient();
}

function loseLife(){
  lives--;
  renderHearts();
  renderPowerupBadges();
  sfxHit();
  spawnBurst(player.x+player.w/2, player.y-player.h/2, '#ef476f', 20);
  wrapEl.classList.remove('shake'); void wrapEl.offsetWidth; wrapEl.classList.add('shake');
  if(lives <= 0){
    saveBestIfRecord();
    state = 'gameover';
    stopAmbient();
  } else {
    state = 'dead';
  }
}

function completeLevel(){
  if(level >= LEVEL_THEMES.length){
    saveBestIfRecord();
    state = 'victory';
    stopAmbient();
    sfxVictory();
  } else {
    state = 'levelclear';
    sfxWin();
  }
}

// --------------------------------------------------------------- PHYSICS
const JUMP_BUFFER_TICKS = 7; // a jump pressed up to this many ticks before landing still fires
const DUCK_LERP = 0.4;       // how fast the duck height eases toward its target each tick

function jump(p){
  if(p.onGround){
    p.vy = JUMP_V; p.onGround = false; p.usedDoubleJump = false;
    p.squash = 1.35; // visual stretch on launch
    return 'ground';
  }
  if(p.doubleJumpAvailable && !p.usedDoubleJump){
    p.vy = DOUBLE_JUMP_V; p.usedDoubleJump = true;
    p.squash = 1.3;
    return 'double';
  }
  if(p.onGround === false) p.jumpBuffer = JUMP_BUFFER_TICKS; // buffer for when we land
  return null;
}
function applyJumpSound(result){
  if(result === 'double') sfxDoubleJump();
  else if(result === 'ground') sfxJump();
}
function shortHop(p){
  if(p && p.vy < -2) p.vy *= SHORT_HOP_DAMP;
}
function physics(p){
  const wasAirborne = !p.onGround;
  p.vy += p.vy > 0 ? GRAVITY * FALL_GRAVITY_MULT : GRAVITY;
  p.y += p.vy;
  if(p.y >= GROUND_Y){
    p.y = GROUND_Y; p.vy = 0; p.onGround = true;
    if(wasAirborne) p.squash = 0.72; // squash on landing impact
  }

  // ease squash back to normal (1) every tick - simple spring-like settle
  p.squash += (1 - p.squash) * 0.3;

  // smoothly interpolate the duck height instead of snapping instantly
  const target = p.ducking ? 1 : 0;
  p.duckAmount += (target - p.duckAmount) * DUCK_LERP;
  if(Math.abs(target - p.duckAmount) < 0.01) p.duckAmount = target;

  // a jump buffered just before landing fires automatically now that we're grounded
  if(p.onGround && p.jumpBuffer > 0){
    const result = jump(p);
    if(p === player) applyJumpSound(result);
    p.jumpBuffer = 0;
  }
  if(p.jumpBuffer > 0) p.jumpBuffer--;
}
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function effectiveHeight(p){
  return PLAYER_H - (PLAYER_H - DUCK_H) * p.duckAmount;
}
function playerHitbox(p){
  const h = effectiveHeight(p);
  return { x:p.x, y:p.y-h, w:p.w, h };
}

// --------------------------------------------------------------- INPUT
function setDuck(down){
  if(state !== 'playing' || !player || player.ducking === down) return;
  player.ducking = down;
  duckLog.push({ frame, down });
}
function tryJump(){
  if(state !== 'playing') return;
  inputLog.push(frame);
  applyJumpSound(jump(player));
}
function advanceFromEndScreen(){
  if(state === 'title'){ startGame(); }
  else if(state === 'dead'){ startLevel(true); }
  else if(state === 'levelclear'){ level++; levelEl.textContent = level; startLevel(true); }
  else if(state === 'victory' || state === 'gameover'){ startGame(); }
}

window.addEventListener('keydown', (e)=>{
  if(e.code === 'Escape' && (state === 'playing' || state === 'paused')){
    e.preventDefault();
    state = state === 'playing' ? 'paused' : 'playing';
    return;
  }
  if(e.code === 'ArrowDown'){ e.preventDefault(); setDuck(true); return; }
  if(e.code === 'Space' || e.code === 'ArrowUp'){
    e.preventDefault();
    if(state === 'playing') tryJump();
    else advanceFromEndScreen();
  }
});
window.addEventListener('keyup', (e)=>{
  if(e.code === 'ArrowDown'){ e.preventDefault(); setDuck(false); return; }
  if(e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); shortHop(player); }
});

pauseBtn.addEventListener('click', ()=>{
  if(state === 'playing' || state === 'paused'){
    state = state === 'playing' ? 'paused' : 'playing';
  }
});

// tapping the canvas on any non-playing screen (title/dead/clear/etc) advances it
canvas.addEventListener('pointerdown', ()=>{
  if(state !== 'playing') advanceFromEndScreen();
});

// dedicated on-screen jump/duck buttons (shown on touch devices via CSS)
const jumpBtn = document.getElementById('jumpBtn');
const duckBtn = document.getElementById('duckBtn');
jumpBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); tryJump(); });
jumpBtn.addEventListener('pointerup', ()=>shortHop(player));
jumpBtn.addEventListener('pointerleave', ()=>shortHop(player));
duckBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); setDuck(true); });
duckBtn.addEventListener('pointerup', ()=>setDuck(false));
duckBtn.addEventListener('pointerleave', ()=>setDuck(false));

// ----------------------------------------------------------------- UPDATE
function updateTickingClock(){
  const progress = distance / LEVEL_LENGTH;
  // accelerate harder near the end of the level - a "docking sequence" style
  // tension build, not a steady metronome
  const climax = Math.pow(progress, 2.2);
  const tickInterval = Math.max(6, 36 - level*3 - climax*26);
  if(frame % Math.round(tickInterval) === 0) sfxTick(0.5 + climax*0.6);
}

function updateGhost(){
  if(!ghostPlayer){ multiplier = 1; return; }

  if(ghostIdx < ghostLog.length && ghostLog[ghostIdx] === frame){ jump(ghostPlayer); ghostIdx++; }
  while(ghostDuckIdx < ghostDuckLog.length && ghostDuckLog[ghostDuckIdx].frame === frame){
    ghostPlayer.ducking = ghostDuckLog[ghostDuckIdx].down;
    ghostDuckIdx++;
  }
  physics(ghostPlayer);

  if(syncCooldown > 0) syncCooldown--;
  const bothAirborne = !player.onGround && !ghostPlayer.onGround;
  const closeTogether = Math.abs(player.y - ghostPlayer.y) < SYNC_DISTANCE;
  if(bothAirborne && closeTogether && syncCooldown === 0){
    multiplier = Math.min(multiplier + 1, MAX_MULTIPLIER);
    syncCooldown = SYNC_COOLDOWN;
    popups.push({ x: player.x, y: player.y-50, text: 'SYNC ×'+multiplier, life: 40 });
    sfxSync();
  }
}

function updateObstacleCollisions(){
  const pBox = playerHitbox(player);
  for(const o of obstacles){
    if(o.passed) continue;
    const oBox = o.hang ? { x:o.x, y:o.y, w:o.w, h:o.h } : { x:o.x, y:GROUND_Y-o.h, w:o.w, h:o.h };
    if(!rectsOverlap(pBox, oBox)) continue;

    if(player.hasShield){
      player.hasShield = false;
      o.passed = true;
      sfxPickup();
      popups.push({ x: player.x, y: player.y-50, text: 'SHIELD BROKE', life: 30 });
    } else {
      loseLife();
      return true; // signal caller to stop processing this frame
    }
  }
  return false;
}

function updatePickups(){
  for(const pu of powerups){
    if(pu.collected) continue;
    const dx = (player.x+player.w/2)-pu.x, dy = (player.y-player.h/2)-pu.y;
    if(Math.hypot(dx,dy) >= 18) continue;
    pu.collected = true;
    if(pu.type === 'shield'){
      player.hasShield = true;
      popups.push({ x:pu.x, y:pu.y, text:'SHIELD UP', life:35 });
    } else {
      player.doubleJumpAvailable = true;
      popups.push({ x:pu.x, y:pu.y, text:'DOUBLE JUMP', life:35 });
    }
    sfxPickup();
  }
  for(const c of coins){
    if(c.collected) continue;
    const dx = (player.x+player.w/2)-c.x, dy = (player.y-player.h/2)-c.y;
    if(Math.hypot(dx,dy) >= 16) continue;
    c.collected = true;
    score += 20*multiplier;
    popups.push({ x:c.x, y:c.y, text:'+'+(20*multiplier), life:30 });
    sfxCoin();
  }
}

function update(){
  frame++;
  distance += worldSpeed;
  score += 1 * multiplier;
  scoreEl.textContent = Math.floor(score/5);

  updateParallax();

  updateTickingClock();

  physics(player);
  if(frame % 3 === 0) spawnTrail(player);
  for(const pt of particles){ pt.x += pt.vx; pt.y += pt.vy; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);

  updateGhost();

  for(const o of obstacles) o.x -= worldSpeed;
  for(const c of coins) c.x -= worldSpeed;
  for(const pu of powerups) pu.x -= worldSpeed;
  finishLineX -= worldSpeed;

  if(updateObstacleCollisions()) return; // life lost this frame, stop here
  updatePickups();
  renderPowerupBadges();

  popups = popups.filter(p => (p.life-- > 0));

  if(distance >= LEVEL_LENGTH) completeLevel();
}

// ----------------------------------------------------------------- DRAW
function centerText(lines, startY=120, lineH=30){
  ctx.textAlign = 'center';
  for(let i=0;i<lines.length;i++){
    const l = lines[i];
    ctx.font = l.font || '16px monospace';
    ctx.fillStyle = l.color || '#eee';
    ctx.fillText(l.text, LOGICAL_W/2, startY + i*lineH);
  }
  ctx.textAlign = 'left';
}

// drifting dust motes for the Dustbowl level
const dustMotes = Array.from({length:40}, () => ({
  x: Math.random()*LOGICAL_W, y: Math.random()*GROUND_Y, s: Math.random()*2+0.5, drift: Math.random()*0.4+0.1
}));

// moves all background parallax layers by exactly one logic tick's worth of
// distance - called only from the fixed-timestep update(), never from draw(),
// so background scroll speed can't drift away from the game world's speed
// on high-refresh-rate displays
function updateParallax(){
  for(const d of dustMotes){
    d.x -= worldSpeed*0.2 + d.drift;
    d.y += Math.sin(frame*0.01 + d.x) * 0.15;
    if(d.x < 0) d.x = LOGICAL_W;
  }
  for(const s of stars){
    s.x -= worldSpeed*0.15;
    if(s.x < 0) s.x = LOGICAL_W;
  }
  for(const h of hills){
    h.x -= worldSpeed*0.25;
    if(h.x < -h.w) h.x += hills.length*160;
  }
}

function drawThemeFx(theme){
  if(theme.fx === 'dust'){
    ctx.fillStyle = 'rgba(201,130,60,0.5)';
    for(const d of dustMotes){
      ctx.fillRect(d.x, d.y, d.s, d.s);
    }
  } else if(theme.fx === 'wormhole'){
    const cx = LOGICAL_W*0.8, cy = 70;
    for(let i=0;i<4;i++){
      const r = 18 + i*14 + (frame*0.6 % 14);
      ctx.strokeStyle = `rgba(199,125,255,${0.35 - i*0.07})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.stroke();
    }
  } else if(theme.fx === 'horizon'){
    const cx = LOGICAL_W*0.78, cy = 64;
    const glow = ctx.createRadialGradient(cx,cy,2,cx,cy,50);
    glow.addColorStop(0, 'rgba(0,0,0,1)');
    glow.addColorStop(0.55, 'rgba(255,107,157,0.5)');
    glow.addColorStop(1, 'rgba(255,107,157,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, 50, 0, Math.PI*2); ctx.fill();
  } else if(theme.fx === 'singularity'){
    const cx = LOGICAL_W*0.76, cy = 60;
    // accretion disc
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(frame*0.01);
    ctx.scale(1, 0.35);
    const disc = ctx.createRadialGradient(0,0,14,0,0,46);
    disc.addColorStop(0, 'rgba(255,209,102,0)');
    disc.addColorStop(0.6, 'rgba(255,209,102,0.55)');
    disc.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(0,0,46,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // event horizon
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI*2); ctx.fill();
  }
}

function drawBackground(theme){
  const grad = ctx.createLinearGradient(0,0,0,LOGICAL_H);
  grad.addColorStop(0, theme.skyTop);
  grad.addColorStop(1, theme.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);

  if(theme.stars){
    ctx.fillStyle = '#fff';
    for(const s of stars){
      ctx.globalAlpha = 0.5; ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  drawThemeFx(theme);

  ctx.fillStyle = theme.hill;
  for(const h of hills){
    ctx.beginPath();
    ctx.moveTo(h.x, GROUND_Y+24);
    ctx.quadraticCurveTo(h.x+h.w/2, GROUND_Y+24-h.h, h.x+h.w, GROUND_Y+24);
    ctx.fill();
  }

  ctx.fillStyle = theme.ground;
  ctx.fillRect(0, GROUND_Y+24, LOGICAL_W, 6);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  ctx.setLineDash([14,10]);
  ctx.lineDashOffset = -distance;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y+27);
  ctx.lineTo(LOGICAL_W, GROUND_Y+27);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawFinishLine(){
  if(finishLineX < -40 || finishLineX > LOGICAL_W+40) return;
  const poleTop = GROUND_Y - 90;
  ctx.fillStyle = '#eee';
  ctx.fillRect(finishLineX, poleTop, 4, GROUND_Y - poleTop + 24);
  // checkered flag
  const flagW = 26, flagH = 16, rows = 4, cols = 4;
  const cw = flagW/cols, ch = flagH/rows;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      ctx.fillStyle = (r+c)%2===0 ? '#111' : '#eee';
      ctx.fillRect(finishLineX+4+c*cw, poleTop+r*ch, cw, ch);
    }
  }
}

function drawEntities(theme){
  for(const pt of particles){
    ctx.globalAlpha = Math.max(pt.life/30, 0) * 0.7;
    ctx.fillStyle = pt.c;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  if(ghostPlayer){
    const box = playerHitbox(ghostPlayer);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(box.x, box.y, box.w, box.h);
  }

  ctx.fillStyle = theme.ob;
  for(const o of obstacles){
    if(o.hang){
      ctx.fillRect(o.x, o.y, o.w, o.h);
    } else if(o.spike){
      ctx.beginPath();
      ctx.moveTo(o.x, GROUND_Y);
      ctx.lineTo(o.x+o.w/2, GROUND_Y-o.h);
      ctx.lineTo(o.x+o.w, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillRect(o.x, GROUND_Y-o.h, o.w, o.h);
    }
  }

  for(const c of coins){
    if(c.collected) continue;
    ctx.save();
    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 3;
    ctx.fillStyle = '#ffd166';
    const squish = 0.75 + 0.25*Math.sin(frame*0.08 + c.phase);
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r*squish+2, c.r, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r*squish+2, c.r, 0, 0, Math.PI*2);
    ctx.stroke();
  }

  for(const pu of powerups){
    if(pu.collected) continue;
    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.rotate(frame*0.05);
    const col = pu.type === 'shield' ? '#4cc9f0' : '#f72585';
    ctx.shadowColor = col; ctx.shadowBlur = 12;
    ctx.fillStyle = col;
    ctx.fillRect(-pu.r, -pu.r, pu.r*2, pu.r*2);
    ctx.restore();
  }

  drawFinishLine();
}

function drawPlayer(){
  const h = effectiveHeight(player); // smoothly interpolated, matches the hitbox exactly
  const py = player.y - h;
  const cx = player.x + player.w/2, cy = py + h/2;

  // squash/stretch: wider+shorter on landing impact, narrower+taller on launch
  const sx = 1 / Math.sqrt(player.squash);
  const sy = player.squash;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(sx, sy);
  ctx.translate(-cx, -cy);

  const px = player.x;
  ctx.save();
  if(player.hasShield){ ctx.shadowColor = '#4cc9f0'; ctx.shadowBlur = 14; }
  ctx.fillStyle = player.hasShield ? '#4cc9f0' : '#06d6a0';
  const r = 6;
  ctx.beginPath();
  ctx.moveTo(px+r, py);
  ctx.arcTo(px+player.w, py, px+player.w, py+h, r);
  ctx.arcTo(px+player.w, py+h, px, py+h, r);
  ctx.arcTo(px, py+h, px, py, r);
  ctx.arcTo(px, py, px+player.w, py, r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(10,10,20,0.6)';
  ctx.fillRect(px+player.w*0.45, py+h*0.2, player.w*0.5, h*0.3);

  if(player.onGround && player.duckAmount < 0.2){
    const legPhase = Math.sin(frame*0.5);
    ctx.strokeStyle = player.hasShield ? '#4cc9f0' : '#06d6a0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px+6, py+h); ctx.lineTo(px+6+legPhase*5, py+h+7);
    ctx.moveTo(px+player.w-6, py+h); ctx.lineTo(px+player.w-6-legPhase*5, py+h+7);
    ctx.stroke();
  }
  if(player.hasShield){
    ctx.strokeStyle = 'rgba(76,201,240,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px+player.w/2, py+h/2, Math.max(player.w,h)*0.9, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawHud(theme){
  ctx.fillStyle = '#222'; ctx.fillRect(10, 10, 100, 6);
  ctx.fillStyle = '#06d6a0'; ctx.fillRect(10, 10, Math.min(100, 100*distance/LEVEL_LENGTH), 6);

  ctx.font = '14px monospace'; ctx.fillStyle = '#ffd166';
  for(const p of popups){ ctx.globalAlpha = Math.max(p.life/40,0); ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;

  ctx.font = '12px monospace'; ctx.fillStyle = '#888';
  ctx.fillText(theme.name, 10, 30);
  if(multiplier > 1){ ctx.fillStyle = '#ffd166'; ctx.fillText('×'+multiplier, LOGICAL_W-30, 30); }
}

function drawVignette(){
  const vg = ctx.createRadialGradient(LOGICAL_W/2,LOGICAL_H/2,120,LOGICAL_W/2,LOGICAL_H/2,320);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
}

// procedural fireworks for the victory screen - deterministic from uiTick,
// so it needs no particle-physics integration and runs even while paused on
// the win screen (the main update() loop only runs during 'playing')
const FIREWORK_SEEDS = Array.from({length:6}, (_, i) => ({
  cx: 60 + (i * 70) % (LOGICAL_W - 100) + 40,
  cy: 40 + (i * 53) % 90,
  color: ['#06d6a0','#ffd166','#4cc9f0','#f72585','#c77dff','#ef476f'][i],
  offset: i * 37,
}));
function drawFireworks(){
  const cycle = 90; // frames per firework burst
  for(const fw of FIREWORK_SEEDS){
    const t = (uiTick + fw.offset) % cycle;
    const progress = t / cycle;
    if(progress > 0.75) continue; // pause between bursts
    const radius = progress * 40;
    const alpha = 1 - progress/0.75;
    const spokes = 10;
    for(let i=0;i<spokes;i++){
      const a = (i/spokes) * Math.PI*2;
      const x = fw.cx + Math.cos(a)*radius;
      const y = fw.cy + Math.sin(a)*radius;
      ctx.globalAlpha = Math.max(alpha, 0);
      ctx.fillStyle = fw.color;
      ctx.fillRect(x-1.5, y-1.5, 3, 3);
    }
  }
  ctx.globalAlpha = 1;
}

function drawOverlay(){
  const dim = (a) => { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H); };
  if(state === 'paused'){
    dim(0.5);
    centerText([
      { text:'Paused', font:'bold 28px monospace', color:'#ffd166' },
      { text:'Press Esc to resume.', font:'14px monospace' },
    ], 140, 30);
  } else if(state === 'dead'){
    dim(0.6);
    centerText([
      { text:'Hit!', font:'bold 28px monospace', color:'#ef476f' },
      { text:'Lives left: '+lives+'.', font:'14px monospace' },
      { text:'Press Space (or ↑) to retry the level.', font:'14px monospace', color:'#ffd166' },
    ], 130, 30);
  } else if(state === 'levelclear'){
    dim(0.6);
    centerText([
      { text:'Level '+level+' clear!', font:'bold 24px monospace', color:'#06d6a0' },
      { text:'Score: '+Math.floor(score/5)+'.', font:'14px monospace' },
      { text:'Press Space (or ↑) for level '+(level+1)+'.', font:'14px monospace', color:'#ffd166' },
    ], 130, 30);
  } else if(state === 'victory'){
    dim(0.5);
    drawFireworks();
    centerText([
      { text:'Journey complete!', font:'bold 22px monospace', color:'#ffd166' },
      { text:'You crossed every finish line.', font:'14px monospace' },
      { text:'Final score: '+Math.floor(score/5)+'.', font:'16px monospace', color:'#06d6a0' },
      { text:'Best: '+Math.floor(best/5)+'.', font:'14px monospace', color:'#ffd166' },
      { text:'Press Space (or ↑) to play again.', font:'14px monospace', color:'#888' },
    ], 70, 28);
  } else if(state === 'gameover'){
    dim(0.65);
    centerText([
      { text:'Game over.', font:'bold 30px monospace', color:'#ef476f' },
      { text:'Score: '+Math.floor(score/5)+'.', font:'16px monospace' },
      { text:'Best: '+Math.floor(best/5)+'.', font:'14px monospace', color:'#ffd166' },
      { text:'Press Space (or ↑) to try again.', font:'14px monospace', color:'#888' },
    ], 120, 32);
  }
}

function draw(){
  const theme = LEVEL_THEMES[level-1] || LEVEL_THEMES[0];

  if(state === 'title'){
    drawBackground(theme);
    centerText([
      { text:'ECHO', font:'bold 44px monospace', color:'#06d6a0' },
      { text:'A journey through dust, gravity, and your own echo.', font:'13px monospace' },
      { text: LEVEL_THEMES.length+' levels: Dustbowl to Singularity · sync multiplier · 3 lives.', font:'11px monospace', color:'#888' },
      { text:'Press Space (or ↑) to start.', font:'16px monospace', color:'#ffd166' },
    ], 110, 34);
    return;
  }

  drawBackground(theme);
  drawEntities(theme);
  drawPlayer();
  drawHud(theme);
  drawVignette();
  drawOverlay();
}

// ------------------------------------------------------------------ LOOP
// Fixed-timestep loop: game logic always advances in identical 1/60s steps,
// decoupled from the display's actual refresh rate. Without this, the game
// would run faster on a 120Hz/144Hz monitor and stutter unevenly whenever a
// frame is dropped - this keeps movement speed and physics perfectly
// consistent on every screen, and keeps visuals smooth by still drawing
// every animation frame even when a logic step doesn't run.
const STEP_MS = 1000 / 60;
const MAX_STEPS_PER_FRAME = 5; // avoids a "spiral of death" after a long stall (e.g. tab backgrounded)
let lastTime = null;
let accumulator = 0;

function loop(now){
  if(lastTime === null) lastTime = now;
  let delta = now - lastTime;
  lastTime = now;
  if(delta > 250) delta = 250; // clamp huge gaps (tab was hidden, debugger paused, etc.)
  accumulator += delta;

  let steps = 0;
  while(accumulator >= STEP_MS && steps < MAX_STEPS_PER_FRAME){
    if(state === 'playing') update();
    uiTick++;
    accumulator -= STEP_MS;
    steps++;
  }

  draw();
  requestAnimationFrame(loop);
}
renderHearts();
renderPowerupBadges();
requestAnimationFrame(loop);
</script>
