<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="ECHO — a free browser runner where you race against a recorded ghost of your own last attempt.">
<meta name="theme-color" content="#0d0d14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2315151f'/%3E%3Crect x='28' y='28' width='44' height='44' rx='10' fill='%2306d6a0'/%3E%3C/svg%3E">
<title>ECHO — race your own ghost</title>
<style>
  :root{
    --bg-deep:#07070c; --panel:#13131c; --panel-edge:#2a2a3a;
    --accent:#06d6a0; --accent-dim:#0a8f6c; --warn:#ffd166; --danger:#ef476f;
    --shield:#4cc9f0; --jump2:#f72585; --text:#eaeaf0; --text-dim:#7a7a8c;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; min-height:100%;
    background:radial-gradient(circle at 50% 0%, #1b1b2e 0%, var(--bg-deep) 70%);
    color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  #app{ display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:520px; }

  header{ text-align:center; }
  header h1{
    margin:0; font-family:'Courier New',monospace; font-size:clamp(28px,7vw,40px);
    letter-spacing:6px; color:var(--accent);
    text-shadow:0 0 18px rgba(6,214,160,0.55), 0 0 2px rgba(6,214,160,0.9);
  }
  header p{ margin:4px 0 0; font-size:12.5px; color:var(--text-dim); letter-spacing:0.5px; }

  #panel{
    width:100%; background:linear-gradient(180deg,var(--panel),#0e0e16);
    border:1px solid var(--panel-edge); border-radius:16px; padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  #hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:13px; }
  .hud-group{ display:flex; align-items:center; gap:10px; }
  .hud-stat{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.1; }
  .hud-stat .label{ font-size:9px; letter-spacing:1.5px; color:var(--text-dim); text-transform:uppercase; }
  .hud-stat .value{ font-size:16px; font-weight:700; color:var(--warn); font-variant-numeric:tabular-nums; }
  #hearts{ display:flex; gap:3px; }
  .heart{ width:14px; height:14px; position:relative; transform:rotate(-45deg); background:var(--danger); border-radius:3px 3px 0 0; transition:opacity .2s, transform .2s; }
  .heart::before, .heart::after{ content:''; position:absolute; width:14px; height:14px; background:var(--danger); border-radius:50%; }
  .heart::before{ left:-7px; top:0; }
  .heart::after{ top:-7px; left:0; }
  .heart.lost{ opacity:0.15; filter:grayscale(1); transform:rotate(-45deg) scale(0.85); }

  #powerupStatus{ display:flex; gap:6px; }
  .pu-badge{
    width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#0007; background:#2a2a3a; opacity:0.35; transition:all .2s;
  }
  .pu-badge.active{ opacity:1; box-shadow:0 0 10px currentColor; color:#000; }
  .pu-badge.shield{ background:var(--shield); color:var(--shield); }
  .pu-badge.shield.active{ background:var(--shield); }
  .pu-badge.jump2{ background:var(--jump2); color:var(--jump2); }
  .pu-badge.jump2.active{ background:var(--jump2); }

  #canvasWrap{ position:relative; width:100%; border-radius:10px; overflow:hidden; line-height:0; touch-action:none; }
  #canvasWrap.shake{ animation:shk 0.25s; }
  canvas{ display:block; width:100%; height:auto; background:#15151f; touch-action:none; }

  @keyframes shk{
    0%{transform:translate(0,0)} 20%{transform:translate(-6px,4px)}
    40%{transform:translate(6px,-4px)} 60%{transform:translate(-4px,2px)}
    80%{transform:translate(4px,-2px)} 100%{transform:translate(0,0)}
  }

  #controlsBar{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:8px; flex-wrap:wrap; }
  #hint{ font-size:11px; color:var(--text-dim); }
  #hint b{ color:var(--text); }
  .iconbtn{
    background:#1d1d2c; border:1px solid var(--panel-edge); color:var(--text-dim);
    border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .iconbtn:hover{ color:var(--text); border-color:var(--accent-dim); }

  #touchControls{ display:none; width:100%; justify-content:space-between; margin-top:10px; gap:10px; }
  #touchControls button{
    flex:1; padding:16px 0; font-size:14px; font-weight:700; letter-spacing:1px;
    border-radius:12px; border:1px solid var(--panel-edge); background:#1a1a28; color:var(--text);
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  #touchControls button:active{ background:var(--accent); color:#001b14; }
  #duckBtn:active{ background:var(--shield); color:#001b2a; }

  footer{ font-size:10.5px; color:#44445a; text-align:center; }

  @media (hover:none) and (pointer:coarse){
    #touchControls{ display:flex; }
    #hint{ display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ECHO</h1>
    <p>race against your own ghost</p>
  </header>

  <div id="panel">
    <div id="hud">
      <div class="hud-group">
        <div class="hud-stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="hud-stat">
          <span class="label">Best</span>
          <span class="value" id="best">0</span>
        </div>
      </div>
      <div class="hud-group">
        <div id="powerupStatus">
          <div class="pu-badge shield" id="badgeShield" title="Shield">S</div>
          <div class="pu-badge jump2" id="badgeJump2" title="Double jump">D</div>
        </div>
        <div id="hearts"></div>
      </div>
      <div class="hud-stat" style="align-items:flex-end">
        <span class="label">Level</span>
        <span class="value"><span id="level">1</span>/<span id="levelMax">5</span></span>
      </div>
    </div>

    <div id="canvasWrap">
      <canvas id="c" width="480" height="320"></canvas>
    </div>

    <div id="controlsBar">
      <div id="hint">
        <b>Up/Space</b> jump &middot; <b>Down</b> duck &middot; <b>Esc</b> pause &middot; cyan=shield pink=double-jump
      </div>
      <button class="iconbtn" id="pauseBtn">Pause</button>
    </div>

    <div id="touchControls">
      <button id="duckBtn">DUCK</button>
      <button id="jumpBtn">JUMP</button>
    </div>
  </div>

  <footer>free &middot; offline &middot; no accounts &middot; your best score is saved on this device</footer>
</div>
<script>
'use strict';

// =========================================================================
// ECHO — a runner where you race against a recorded ghost of your own
// last attempt. Free, offline, single-file, no external assets.
// =========================================================================

// ---------------------------------------------------------------- CONSTANTS
const GROUND_Y = 260;
const GRAVITY = 0.6;
const FALL_GRAVITY_MULT = 1.5;   // fall faster than you rise -> snappier jumps
const JUMP_V = -11;
const DOUBLE_JUMP_V = JUMP_V * 0.85;
const SHORT_HOP_DAMP = 0.45;     // releasing jump early cuts the arc short
const LEVEL_LENGTH = 3200;
const PLAYER_W = 24, PLAYER_H = 24, DUCK_H = 12;
const SYNC_DISTANCE = 18;        // how close player+ghost must be, mid-air, to sync
const SYNC_COOLDOWN = 60;
const MAX_MULTIPLIER = 5;
const BEST_KEY = 'echo_best_score';

const LEVEL_THEMES = [
  { name:'MEADOW', skyTop:'#2b2d5e', skyBot:'#15151f', hill:'#1f2140', ground:'#2a2a3a', ob:'#ef476f', speed:4.0, gap:240, stars:false },
  { name:'CANYON', skyTop:'#3a2440', skyBot:'#1a1420', hill:'#2a1a30', ground:'#3a2a3a', ob:'#f78c6b', speed:4.6, gap:215, stars:false },
  { name:'VOID',   skyTop:'#101035', skyBot:'#0a0a16', hill:'#161638', ground:'#242450', ob:'#c77dff', speed:5.2, gap:195, stars:true  },
  { name:'STORM',  skyTop:'#241533', skyBot:'#101018', hill:'#1c1228', ground:'#2a1f3a', ob:'#ff6b9d', speed:5.8, gap:180, stars:true  },
  { name:'CORE',   skyTop:'#1a0a10', skyBot:'#060608', hill:'#200c10', ground:'#3a2a2a', ob:'#ffd166', speed:6.6, gap:165, stars:true  },
];
// how far past the level length the finish line starts, so it scrolls into
// view and reaches the player right as the level actually completes
const FINISH_LEAD = 80;

// ------------------------------------------------------------------- DOM
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const levelMaxEl = document.getElementById('levelMax');
const bestEl = document.getElementById('best');
const wrapEl = document.getElementById('canvasWrap');
const heartsEl = document.getElementById('hearts');
const badgeShieldEl = document.getElementById('badgeShield');
const badgeJump2El = document.getElementById('badgeJump2');
const pauseBtn = document.getElementById('pauseBtn');
levelMaxEl.textContent = LEVEL_THEMES.length;

function renderHearts(){
  heartsEl.innerHTML = '';
  for(let i=0;i<3;i++){
    const h = document.createElement('div');
    h.className = 'heart' + (i >= lives ? ' lost' : '');
    heartsEl.appendChild(h);
  }
}
function renderPowerupBadges(){
  badgeShieldEl.classList.toggle('active', !!(player && player.hasShield));
  badgeJump2El.classList.toggle('active', !!(player && player.doubleJumpAvailable));
}

// --------------------------------------------------------- PERSISTENCE
let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
bestEl.textContent = Math.floor(best/5);

function saveBestIfRecord(){
  if(score > best){
    best = score;
    localStorage.setItem(BEST_KEY, best);
    bestEl.textContent = Math.floor(best/5);
  }
}

// ----------------------------------------------------------- AUDIO (free, synthesized, no files)
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function sfx(freq, dur, type='square', vol=0.08){
  try{
    const ac = ensureAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type; osc.frequency.value = freq; gain.gain.value = vol;
    osc.connect(gain); gain.connect(ac.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    osc.stop(ac.currentTime + dur);
  } catch(e){ /* audio unsupported/blocked - game still works silently */ }
}
// a short "clock tick" instead of a generic beep (Interstellar-style motif,
// original/synthesized - not a reproduction of any copyrighted score)
function sfxTick(pitchMul=1){
  try{
    const ac = ensureAudio();
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1800 * pitchMul;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.09, t+0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.045);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t); osc.stop(t+0.05);
  } catch(e){}
}
const sfxJump       = () => sfxTick(1);
const sfxDoubleJump = () => sfxTick(1.5);
const sfxCoin       = () => { sfx(880,0.08,'triangle'); setTimeout(()=>sfx(1320,0.08,'triangle'),40); };
const sfxSync       = () => { sfx(660,0.1,'sawtooth'); setTimeout(()=>sfx(990,0.15,'sawtooth'),60); };
const sfxHit        = () => sfx(160,0.25,'sawtooth',0.1);
const sfxPickup     = () => { sfx(300,0.15,'sine',0.08); setTimeout(()=>sfx(450,0.15,'sine',0.08),80); };
const sfxWin        = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,0.2,'triangle',0.09), i*110));

// ambient organ-pad drone + slow swell (original composition, not a cover)
let ambient = null;
function startAmbient(){
  const ac = ensureAudio();
  stopAmbient();
  const master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(0.05, ac.currentTime + 2);

  const oscs = [55, 55*1.5, 55*2].map((freq, i) => {
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.detune.value = (i-1) * 4;
    const g = ac.createGain();
    g.gain.value = i === 0 ? 1 : 0.4;
    osc.connect(g); g.connect(master);
    osc.start();
    return osc;
  });

  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.08;
  const lfoGain = ac.createGain();
  lfoGain.gain.value = 0.015;
  lfo.connect(lfoGain); lfoGain.connect(master.gain);
  lfo.start();

  ambient = { master, oscs, lfo };
}
function stopAmbient(){
  if(!ambient) return;
  const ac = ensureAudio();
  const t = ac.currentTime;
  try{
    ambient.master.gain.cancelScheduledValues(t);
    ambient.master.gain.setValueAtTime(ambient.master.gain.value, t);
    ambient.master.gain.linearRampToValueAtTime(0, t+0.8);
    const toStop = ambient;
    setTimeout(()=>{ toStop.oscs.forEach(o=>o.stop()); toStop.lfo.stop(); }, 850);
  } catch(e){}
  ambient = null;
}

// -------------------------------------------------------- GAME STATE
// 'title' | 'playing' | 'paused' | 'dead' | 'levelclear' | 'victory' | 'gameover'
let state = 'title';
let level = 1, lives = 3, score = 0;
let multiplier = 1, syncCooldown = 0;
let frame = 0, distance = 0, worldSpeed = LEVEL_THEMES[0].speed;
let finishLineX = 0;

let player, ghostPlayer;
let obstacles, coins, powerups, popups, particles;
let inputLog, duckLog, ghostLog, ghostDuckLog, ghostIdx, ghostDuckIdx;

const stars = Array.from({length:60}, () => ({
  x: Math.random()*480, y: Math.random()*220, s: Math.random()*1.5+0.5
}));
const hills = Array.from({length:6}, (_, i) => ({
  x: i*160, w: 140+Math.random()*60, h: 40+Math.random()*50
}));

// --------------------------------------------------------- ENTITY FACTORIES
function newPlayer(){
  return {
    x: 60, y: GROUND_Y, vy: 0, w: PLAYER_W, h: PLAYER_H,
    onGround: true, ducking: false,
    hasShield: false, doubleJumpAvailable: false, usedDoubleJump: false,
  };
}

function makeObstacles(theme){
  const list = [];
  let x = 500;
  while(x < LEVEL_LENGTH){
    x += theme.gap + Math.random()*80;
    if(Math.random() < 0.3){
      list.push({ x, w:26, h:20, hang:true, y: GROUND_Y-46, passed:false });
    } else {
      list.push({ x, w:20, h:20+Math.random()*26, hang:false, spike: Math.random()<0.5, passed:false });
    }
  }
  return list;
}
function makeCoins(){
  const list = [];
  let x = 420;
  while(x < LEVEL_LENGTH){
    x += 170 + Math.random()*60;
    list.push({ x, y: GROUND_Y-50-Math.random()*40, r:6, collected:false });
  }
  return list;
}
function makePowerups(){
  const list = [];
  let x = 700;
  while(x < LEVEL_LENGTH){
    x += 500 + Math.random()*400;
    list.push({ x, y: GROUND_Y-60, r:9, collected:false, type: Math.random()<0.5 ? 'shield' : 'jump2' });
  }
  return list;
}

function spawnTrail(p){
  particles.push({ x:p.x+p.w/2, y:p.y-p.h/2, life:16, vx:-worldSpeed*0.3-Math.random(), vy:(Math.random()-0.5), c:'#06d6a0', size:3 });
}
function spawnBurst(x, y, color, count=14){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, sp = 1+Math.random()*3;
    particles.push({ x, y, life:30, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, c:color, size:3 });
  }
}

// ------------------------------------------------------------- FLOW CONTROL
function startLevel(keepGhost){
  const theme = LEVEL_THEMES[level-1];
  worldSpeed = theme.speed;
  distance = 0; frame = 0;
  finishLineX = LEVEL_LENGTH + FINISH_LEAD;

  player = newPlayer();
  obstacles = makeObstacles(theme);
  coins = makeCoins();
  powerups = makePowerups();
  multiplier = 1; syncCooldown = 0;
  popups = []; particles = [];
  renderPowerupBadges();

  if(keepGhost && inputLog && inputLog.length){
    ghostLog = inputLog.slice();
    ghostDuckLog = duckLog.slice();
  }
  inputLog = []; duckLog = [];
  if(ghostLog && ghostLog.length){
    ghostPlayer = newPlayer();
    ghostIdx = 0; ghostDuckIdx = 0;
  } else {
    ghostPlayer = null;
  }
  state = 'playing';
}

function startGame(){
  level = 1; lives = 3; score = 0;
  ghostLog = []; ghostDuckLog = []; ghostPlayer = null;
  renderHearts();
  levelEl.textContent = level;
  scoreEl.textContent = 0;
  startLevel(false);
  startAmbient();
}

function loseLife(){
  lives--;
  renderHearts();
  renderPowerupBadges();
  sfxHit();
  spawnBurst(player.x+player.w/2, player.y-player.h/2, '#ef476f', 20);
  wrapEl.classList.remove('shake'); void wrapEl.offsetWidth; wrapEl.classList.add('shake');
  if(lives <= 0){
    saveBestIfRecord();
    state = 'gameover';
    stopAmbient();
  } else {
    state = 'dead';
  }
}

function completeLevel(){
  sfxWin();
  if(level >= LEVEL_THEMES.length){
    saveBestIfRecord();
    state = 'victory';
    stopAmbient();
  } else {
    state = 'levelclear';
  }
}

// --------------------------------------------------------------- PHYSICS
function jump(p){
  if(p.onGround){
    p.vy = JUMP_V; p.onGround = false; p.usedDoubleJump = false;
    return 'ground';
  }
  if(p.doubleJumpAvailable && !p.usedDoubleJump){
    p.vy = DOUBLE_JUMP_V; p.usedDoubleJump = true;
    return 'double';
  }
  return null;
}
function applyJumpSound(result){
  if(result === 'double') sfxDoubleJump();
  else if(result === 'ground') sfxJump();
}
function shortHop(p){
  if(p && p.vy < -2) p.vy *= SHORT_HOP_DAMP;
}
function physics(p){
  p.vy += p.vy > 0 ? GRAVITY * FALL_GRAVITY_MULT : GRAVITY;
  p.y += p.vy;
  if(p.y >= GROUND_Y){ p.y = GROUND_Y; p.vy = 0; p.onGround = true; }
}
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function playerHitbox(p){
  const h = p.ducking ? DUCK_H : p.h;
  return { x:p.x, y:p.y-h, w:p.w, h };
}

// --------------------------------------------------------------- INPUT
function setDuck(down){
  if(state !== 'playing' || !player || player.ducking === down) return;
  player.ducking = down;
  duckLog.push({ frame, down });
}
function tryJump(){
  if(state !== 'playing') return;
  inputLog.push(frame);
  applyJumpSound(jump(player));
}
function advanceFromEndScreen(){
  if(state === 'title'){ startGame(); }
  else if(state === 'dead'){ startLevel(true); }
  else if(state === 'levelclear'){ level++; levelEl.textContent = level; startLevel(true); }
  else if(state === 'victory' || state === 'gameover'){ startGame(); }
}

window.addEventListener('keydown', (e)=>{
  if(e.code === 'Escape' && (state === 'playing' || state === 'paused')){
    e.preventDefault();
    state = state === 'playing' ? 'paused' : 'playing';
    return;
  }
  if(e.code === 'ArrowDown'){ setDuck(true); return; }
  if(e.code === 'Space' || e.code === 'ArrowUp'){
    e.preventDefault();
    if(state === 'playing') tryJump();
    else advanceFromEndScreen();
  }
});
window.addEventListener('keyup', (e)=>{
  if(e.code === 'ArrowDown'){ setDuck(false); return; }
  if(e.code === 'Space' || e.code === 'ArrowUp') shortHop(player);
});

pauseBtn.addEventListener('click', ()=>{
  if(state === 'playing' || state === 'paused'){
    state = state === 'playing' ? 'paused' : 'playing';
  }
});

// tapping the canvas on any non-playing screen (title/dead/clear/etc) advances it
canvas.addEventListener('pointerdown', ()=>{
  if(state !== 'playing') advanceFromEndScreen();
});

// dedicated on-screen jump/duck buttons (shown on touch devices via CSS)
const jumpBtn = document.getElementById('jumpBtn');
const duckBtn = document.getElementById('duckBtn');
jumpBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); tryJump(); });
jumpBtn.addEventListener('pointerup', ()=>shortHop(player));
jumpBtn.addEventListener('pointerleave', ()=>shortHop(player));
duckBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); setDuck(true); });
duckBtn.addEventListener('pointerup', ()=>setDuck(false));
duckBtn.addEventListener('pointerleave', ()=>setDuck(false));

// ----------------------------------------------------------------- UPDATE
function updateTickingClock(){
  const progress = distance / LEVEL_LENGTH;
  const tickInterval = Math.max(10, 36 - level*3 - progress*14);
  if(frame % Math.round(tickInterval) === 0) sfxTick(0.5 + progress*0.3);
}

function updateGhost(){
  if(!ghostPlayer){ multiplier = 1; return; }

  if(ghostIdx < ghostLog.length && ghostLog[ghostIdx] === frame){ jump(ghostPlayer); ghostIdx++; }
  while(ghostDuckIdx < ghostDuckLog.length && ghostDuckLog[ghostDuckIdx].frame === frame){
    ghostPlayer.ducking = ghostDuckLog[ghostDuckIdx].down;
    ghostDuckIdx++;
  }
  physics(ghostPlayer);

  if(syncCooldown > 0) syncCooldown--;
  const bothAirborne = !player.onGround && !ghostPlayer.onGround;
  const closeTogether = Math.abs(player.y - ghostPlayer.y) < SYNC_DISTANCE;
  if(bothAirborne && closeTogether && syncCooldown === 0){
    multiplier = Math.min(multiplier + 1, MAX_MULTIPLIER);
    syncCooldown = SYNC_COOLDOWN;
    popups.push({ x: player.x, y: player.y-50, text: 'SYNC x'+multiplier, life: 40 });
    sfxSync();
  }
}

function updateObstacleCollisions(){
  const pBox = playerHitbox(player);
  for(const o of obstacles){
    if(o.passed) continue;
    const oBox = o.hang ? { x:o.x, y:o.y, w:o.w, h:o.h } : { x:o.x, y:GROUND_Y-o.h, w:o.w, h:o.h };
    if(!rectsOverlap(pBox, oBox)) continue;

    if(player.hasShield){
      player.hasShield = false;
      o.passed = true;
      sfxPickup();
      popups.push({ x: player.x, y: player.y-50, text: 'SHIELD BROKE', life: 30 });
    } else {
      loseLife();
      return true; // signal caller to stop processing this frame
    }
  }
  return false;
}

function updatePickups(){
  for(const pu of powerups){
    if(pu.collected) continue;
    const dx = (player.x+player.w/2)-pu.x, dy = (player.y-player.h/2)-pu.y;
    if(Math.hypot(dx,dy) >= 18) continue;
    pu.collected = true;
    if(pu.type === 'shield'){
      player.hasShield = true;
      popups.push({ x:pu.x, y:pu.y, text:'SHIELD UP', life:35 });
    } else {
      player.doubleJumpAvailable = true;
      popups.push({ x:pu.x, y:pu.y, text:'DOUBLE JUMP', life:35 });
    }
    sfxPickup();
  }
  for(const c of coins){
    if(c.collected) continue;
    const dx = (player.x+player.w/2)-c.x, dy = (player.y-player.h/2)-c.y;
    if(Math.hypot(dx,dy) >= 16) continue;
    c.collected = true;
    score += 20*multiplier;
    popups.push({ x:c.x, y:c.y, text:'+'+(20*multiplier), life:30 });
    sfxCoin();
  }
}

function update(){
  frame++;
  distance += worldSpeed;
  score += 1 * multiplier;
  scoreEl.textContent = Math.floor(score/5);

  updateTickingClock();

  physics(player);
  if(frame % 3 === 0) spawnTrail(player);
  for(const pt of particles){ pt.x += pt.vx; pt.y += pt.vy; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);

  updateGhost();

  for(const o of obstacles) o.x -= worldSpeed;
  for(const c of coins) c.x -= worldSpeed;
  for(const pu of powerups) pu.x -= worldSpeed;
  finishLineX -= worldSpeed;

  if(updateObstacleCollisions()) return; // life lost this frame, stop here
  updatePickups();
  renderPowerupBadges();

  popups = popups.filter(p => (p.life-- > 0));

  if(distance >= LEVEL_LENGTH) completeLevel();
}

// ----------------------------------------------------------------- DRAW
function centerText(lines, startY=120, lineH=30){
  ctx.textAlign = 'center';
  for(let i=0;i<lines.length;i++){
    const l = lines[i];
    ctx.font = l.font || '16px monospace';
    ctx.fillStyle = l.color || '#eee';
    ctx.fillText(l.text, canvas.width/2, startY + i*lineH);
  }
  ctx.textAlign = 'left';
}

function drawBackground(theme){
  const grad = ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0, theme.skyTop);
  grad.addColorStop(1, theme.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(theme.stars){
    ctx.fillStyle = '#fff';
    for(const s of stars){
      s.x -= worldSpeed*0.15; if(s.x < 0) s.x = canvas.width;
      ctx.globalAlpha = 0.5; ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = theme.hill;
  for(const h of hills){
    h.x -= worldSpeed*0.25; if(h.x < -h.w) h.x += hills.length*160;
    ctx.beginPath();
    ctx.moveTo(h.x, GROUND_Y+24);
    ctx.quadraticCurveTo(h.x+h.w/2, GROUND_Y+24-h.h, h.x+h.w, GROUND_Y+24);
    ctx.fill();
  }

  ctx.fillStyle = theme.ground;
  ctx.fillRect(0, GROUND_Y+24, canvas.width, 6);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  ctx.setLineDash([14,10]);
  ctx.lineDashOffset = -distance;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y+27);
  ctx.lineTo(canvas.width, GROUND_Y+27);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawFinishLine(){
  if(finishLineX < -40 || finishLineX > canvas.width+40) return;
  const poleTop = GROUND_Y - 90;
  ctx.fillStyle = '#eee';
  ctx.fillRect(finishLineX, poleTop, 4, GROUND_Y - poleTop + 24);
  // checkered flag
  const flagW = 26, flagH = 16, rows = 4, cols = 4;
  const cw = flagW/cols, ch = flagH/rows;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      ctx.fillStyle = (r+c)%2===0 ? '#111' : '#eee';
      ctx.fillRect(finishLineX+4+c*cw, poleTop+r*ch, cw, ch);
    }
  }
}

function drawEntities(theme){
  for(const pt of particles){
    ctx.globalAlpha = Math.max(pt.life/30, 0) * 0.7;
    ctx.fillStyle = pt.c;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  if(ghostPlayer){
    const box = playerHitbox(ghostPlayer);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(box.x, box.y, box.w, box.h);
  }

  ctx.fillStyle = theme.ob;
  for(const o of obstacles){
    if(o.hang){
      ctx.fillRect(o.x, o.y, o.w, o.h);
    } else if(o.spike){
      ctx.beginPath();
      ctx.moveTo(o.x, GROUND_Y);
      ctx.lineTo(o.x+o.w/2, GROUND_Y-o.h);
      ctx.lineTo(o.x+o.w, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillRect(o.x, GROUND_Y-o.h, o.w, o.h);
    }
  }

  for(const c of coins){
    if(c.collected) continue;
    ctx.save();
    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#ffd166';
    const squish = Math.abs(Math.sin(frame*0.1 + c.x));
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r*squish+2, c.r, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  for(const pu of powerups){
    if(pu.collected) continue;
    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.rotate(frame*0.05);
    const col = pu.type === 'shield' ? '#4cc9f0' : '#f72585';
    ctx.shadowColor = col; ctx.shadowBlur = 12;
    ctx.fillStyle = col;
    ctx.fillRect(-pu.r, -pu.r, pu.r*2, pu.r*2);
    ctx.restore();
  }

  drawFinishLine();
}

function drawPlayer(){
  const h = player.ducking ? DUCK_H : player.h;
  const px = player.x, py = player.y - h;

  ctx.save();
  if(player.hasShield){ ctx.shadowColor = '#4cc9f0'; ctx.shadowBlur = 14; }
  ctx.fillStyle = player.hasShield ? '#4cc9f0' : '#06d6a0';
  const r = 6;
  ctx.beginPath();
  ctx.moveTo(px+r, py);
  ctx.arcTo(px+player.w, py, px+player.w, py+h, r);
  ctx.arcTo(px+player.w, py+h, px, py+h, r);
  ctx.arcTo(px, py+h, px, py, r);
  ctx.arcTo(px, py, px+player.w, py, r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(10,10,20,0.6)';
  ctx.fillRect(px+player.w*0.45, py+h*0.2, player.w*0.5, h*0.3);

  if(player.onGround && !player.ducking){
    const legPhase = Math.sin(frame*0.5);
    ctx.strokeStyle = player.hasShield ? '#4cc9f0' : '#06d6a0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px+6, py+h); ctx.lineTo(px+6+legPhase*5, py+h+7);
    ctx.moveTo(px+player.w-6, py+h); ctx.lineTo(px+player.w-6-legPhase*5, py+h+7);
    ctx.stroke();
  }
  if(player.hasShield){
    ctx.strokeStyle = 'rgba(76,201,240,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px+player.w/2, py+h/2, Math.max(player.w,h)*0.9, 0, Math.PI*2);
    ctx.stroke();
  }
}

function drawHud(theme){
  ctx.fillStyle = '#222'; ctx.fillRect(10, 10, 100, 6);
  ctx.fillStyle = '#06d6a0'; ctx.fillRect(10, 10, Math.min(100, 100*distance/LEVEL_LENGTH), 6);

  ctx.font = '14px monospace'; ctx.fillStyle = '#ffd166';
  for(const p of popups){ ctx.globalAlpha = Math.max(p.life/40,0); ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;

  ctx.font = '12px monospace'; ctx.fillStyle = '#888';
  ctx.fillText(theme.name, 10, 30);
  if(multiplier > 1){ ctx.fillStyle = '#ffd166'; ctx.fillText('x'+multiplier, canvas.width-30, 30); }
}

function drawVignette(){
  const vg = ctx.createRadialGradient(canvas.width/2,canvas.height/2,120,canvas.width/2,canvas.height/2,320);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawOverlay(){
  const dim = (a) => { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0,0,canvas.width,canvas.height); };
  if(state === 'paused'){
    dim(0.5);
    centerText([
      { text:'PAUSED', font:'bold 28px monospace', color:'#ffd166' },
      { text:'press ESC to resume', font:'14px monospace' },
    ], 140, 30);
  } else if(state === 'dead'){
    dim(0.6);
    centerText([
      { text:'HIT!', font:'bold 28px monospace', color:'#ef476f' },
      { text:'lives left: '+lives, font:'14px monospace' },
      { text:'press SPACE to retry level', font:'14px monospace', color:'#ffd166' },
    ], 130, 30);
  } else if(state === 'levelclear'){
    dim(0.6);
    centerText([
      { text:'LEVEL '+level+' CLEAR', font:'bold 24px monospace', color:'#06d6a0' },
      { text:'score: '+Math.floor(score/5), font:'14px monospace' },
      { text:'press SPACE for level '+(level+1), font:'14px monospace', color:'#ffd166' },
    ], 130, 30);
  } else if(state === 'victory'){
    dim(0.65);
    centerText([
      { text:'YOU WIN', font:'bold 30px monospace', color:'#06d6a0' },
      { text:'final score: '+Math.floor(score/5), font:'16px monospace' },
      { text:'best: '+Math.floor(best/5), font:'14px monospace', color:'#ffd166' },
      { text:'press SPACE to play again', font:'14px monospace', color:'#888' },
    ], 120, 32);
  } else if(state === 'gameover'){
    dim(0.65);
    centerText([
      { text:'GAME OVER', font:'bold 30px monospace', color:'#ef476f' },
      { text:'score: '+Math.floor(score/5), font:'16px monospace' },
      { text:'best: '+Math.floor(best/5), font:'14px monospace', color:'#ffd166' },
      { text:'press SPACE to try again', font:'14px monospace', color:'#888' },
    ], 120, 32);
  }
}

function draw(){
  const theme = LEVEL_THEMES[level-1] || LEVEL_THEMES[0];

  if(state === 'title'){
    drawBackground(theme);
    centerText([
      { text:'ECHO', font:'bold 44px monospace', color:'#06d6a0' },
      { text:'race against your own ghost', font:'14px monospace' },
      { text: LEVEL_THEMES.length+' levels · sync multiplier · duck + jump · 3 lives', font:'12px monospace', color:'#888' },
      { text:'press SPACE to start', font:'16px monospace', color:'#ffd166' },
    ], 110, 34);
    return;
  }

  drawBackground(theme);
  drawEntities(theme);
  drawPlayer();
  drawHud(theme);
  drawVignette();
  drawOverlay();
}

// ------------------------------------------------------------------ LOOP
function loop(){
  if(state === 'playing') update();
  draw();
  requestAnimationFrame(loop);
}
renderHearts();
renderPowerupBadges();
loop();
</script>
